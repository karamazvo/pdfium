name: r37 blend group cancellation path display-list - Build patched PDFium Android arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build libpdfium.so
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      WORK_ROOT: /tmp/pdfium-r37
      OUT_DIR: out/android_arm64_agg
      DIST_DIR: ${{ github.workspace }}/artifacts/libpdfium-android-arm64-r37-blend-group-cancellation-path-display-list

    steps:
      - name: Checkout PDFium patch repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            ca-certificates \
            curl \
            file \
            git \
            lsb-release \
            openjdk-17-jdk-headless \
            python3 \
            python3-pkg-resources \
            python3-setuptools \
            unzip \
            xz-utils \
            zip

      - name: Fetch depot_tools
        run: |
          mkdir -p "$WORK_ROOT"
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$WORK_ROOT/depot_tools"
          echo "$WORK_ROOT/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch PDFium fork with Android deps
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"

          mkdir -p "$WORK_ROOT/pdfium_build"
          cd "$WORK_ROOT/pdfium_build"

          cat > .gclient <<GCLEOF
          solutions = [
            {
              "name": "pdfium",
              "url": "https://github.com/${{ github.repository }}.git",
              "managed": False,
              "revision": "${{ github.sha }}",
              "custom_deps": {},
              "custom_vars": {
                "checkout_android": True,
                "checkout_configuration": "default",
                "checkout_rust": False,
              },
            },
          ]
          target_os = ["android"]
          GCLEOF

          gclient sync --no-history --nohooks

      - name: Patch public PDFium API exports
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"
          python3 "$GITHUB_WORKSPACE/repo/scripts/ci/patch_pdfium_public_exports.py"

      - name: Apply xPDFSDK PDFium patches
        run: |
          PDFIUM_DIR="$WORK_ROOT/pdfium_build/pdfium"
          for patch in \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0[1-9]-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0011-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0012-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0013-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0014-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0015-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0016-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0017-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0018-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0019-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0020-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0021-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0022-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0023-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0024-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0025-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0026-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0029-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0030-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0031-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0032-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0034-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0035-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0036-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0037-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0038-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0039-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0040-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0041-*.patch \
              ; do
            echo "Applying ${patch#$GITHUB_WORKSPACE/repo/}"
            git -C "$PDFIUM_DIR" apply --check "$patch"
            git -C "$PDFIUM_DIR" apply "$patch"
          done
          git -C "$PDFIUM_DIR" diff --check
          git -C "$PDFIUM_DIR" diff --stat

          if grep -RIE 'XPDF_ATRACE_SCOPED|ATrace_beginSection' \
              "$PDFIUM_DIR/core/" "$PDFIUM_DIR/fpdfsdk/" 2>/dev/null; then
            echo "ERROR: diagnostic ATrace markers present in r37 build" >&2
            exit 1
          fi

      - name: Install PDFium build dependencies
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build/pdfium"
          build/install-build-deps.sh --android --no-prompt --unsupported

      - name: Run gclient hooks
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build"
          gclient runhooks

      - name: Generate GN files
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          PDFIUM_DIR="$WORK_ROOT/pdfium_build/pdfium"
          cd "$PDFIUM_DIR"
          gn gen "$OUT_DIR" --args='
            target_os = "android"
            target_cpu = "arm64"
            is_debug = false
            is_component_build = false
            strip_debug_info = true
            use_remoteexec = false
            symbol_level = 0
            treat_warnings_as_errors = false
            clang_use_chrome_plugins = false
            android_static_analysis = "off"
            pdf_is_standalone = false
            pdf_is_complete_lib = true
            pdf_use_skia = false
            pdf_use_agg = true
            pdf_enable_v8 = false
            pdf_enable_xfa = false
            pdf_enable_fontations = false
            pdf_enable_rust_png = false
            pdf_use_partition_alloc = false
            default_min_sdk_version = 23
          '
          gn args "$OUT_DIR" --list --short \
            | grep -E '^(target_os|target_cpu|pdf_enable_v8|pdf_enable_xfa|pdf_use_skia|pdf_use_agg|pdf_is_complete_lib|pdf_use_partition_alloc|default_min_sdk_version|pdf_enable_fontations|pdf_enable_rust_png) ='

      - name: Build static PDFium
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build/pdfium"
          ninja -C "$OUT_DIR" pdfium -j"$(nproc)"

      - name: Verify r37 blend group cancellation compiled in
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"

          LLVM_NM="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
          PDFIUM_A="$OUT_DIR/obj/libpdfium.a"

          for api in FPDFEx_SetRenderAbort FPDFEx_SetRenderCallbacks FPDFEx_SetRenderSkipMask FPDFEx_SetHugeImagePixelThreshold; do
            if ! "$LLVM_NM" -A "$PDFIUM_A" 2>/dev/null \
                | grep -E " T $api(\b|@)" >/dev/null; then
              echo "MISSING $api in libpdfium.a" >&2
              exit 1
            fi
            echo "OK $api"
          done

          grep -q 'ShouldCancelRender' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'FPDFEX_FEATURE_PATH_DISPLAY_LIST_FORM' public/fpdfex_render_callbacks.h
          grep -q 'VeloceTryRenderPathDisplayListForHolder' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'CanDrawBlendNodeWithMask' core/fpdfapi/render/veloce_path_display_list.cpp
          # r25 base: group buffer blend
          grep -q 'FlushGroupRun' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'groupRunComposites=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'FXDIB_Format::kBgra' core/fpdfapi/render/veloce_path_display_list.cpp
          # r26-specific: stroke run packing
          grep -q 'IsStrokeOnlyNormal' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'stroke_run_path' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'stroke_run_draws' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'stroke_run_count' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'strokeRunDraws=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'strokeRunNodes=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'maxStrokeRunNodes=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'stroke_run_path\.Append(\*path, nullptr)' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'DrawPath(stroke_run_path, &stroke_run_matrix' core/fpdfapi/render/veloce_path_display_list.cpp
          # r28-specific: ordered path/text segments
          grep -q 'PathDlSegmentKind' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'kTextPassthrough' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'unsupported_passthrough_object' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'empty_segment_plan' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'textPassthroughObjects=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'pathSegments=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'RenderSingleObject(passthrough_obj' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'ProcessClipPath(empty_clip' core/fpdfapi/render/veloce_path_display_list.cpp
          # r29-specific: stroke-run flush telemetry
          grep -q 'StrokeRunFlushReason' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'ClassifyStrokePaintChange' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'RecordStrokeRunFlush' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'strokeRunFlushPaint=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'strokeRunFlushColor=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'strokeRunFlushGraphState=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'strokeRunFlushMatrix=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'strokeRunFlushPathStyle=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'strokeRunFlushFillMode=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'strokeRunFlushClip=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'strokeRunFlushBlend=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'strokeRunFlushSegment=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'strokeRunFlushCapacity=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'strokeRunFlushEnd=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          # r30-specific: non-overlap fill barrier crossing for stroke packing
          grep -q 'GetExpandedClippedDeviceRect' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'RectsIntersect' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'UnionRect' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'strokeRunFillBarriersCrossed=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'strokeRunFillBarriersBlocked=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'stroke_run_fill_barriers_crossed' core/fpdfapi/render/veloce_path_display_list.cpp
          # r31-specific: holder-space spatial index for tile replay
          grep -q 'PathDlSpatialIndex' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'BuildPathDlSpatialIndex' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'QuerySpatialIndexForReplay' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'kSpatialIndexColumns' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'holder_to_device.GetInverse' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'spatialIndexBins=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'spatialIndexCandidates=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'spatialIndexSkippedByTile=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          # r33-specific: text passthrough is cache-safe again because cached
          # segments store holder object indexes and resolve live objects before
          # drawing.
          grep -q 'passthrough_obj_index' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'ResolveTextPassthroughSegments' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'ReplayPathDisplayList(status, holder' core/fpdfapi/render/veloce_path_display_list.cpp
          # r34-specific: compact fill-barrier telemetry for Q16 stroke-run
          # flush analysis.
          grep -q 'VelocePathDLFill' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'RecordFillBarrierTelemetry' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'fill_barrier_pending_overlap' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'fill_barrier_pending_disjoint' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'fill_barrier_rect_like' core/fpdfapi/render/veloce_path_display_list.cpp
          # r37-specific: cooperative cancellation inside group-buffer blend
          # flushes.
          grep -q 'CheckBlendRunCancel' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'blendCancelChecks=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'blendCancelledAfterComposites=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'FlushGroupRun(status, device' core/fpdfapi/render/veloce_path_display_list.cpp
          if grep -q 'text_passthrough_objects == 0' core/fpdfapi/render/veloce_path_display_list.cpp; then
            echo "ERROR: r32 text-passthrough cache-disable guard remains in r34" >&2
            exit 1
          fi
          if grep -q 'Do not retain them in the process' core/fpdfapi/render/veloce_path_display_list.cpp; then
            echo "ERROR: r32 raw-pointer cache-disable comment remains in r34" >&2
            exit 1
          fi
          # guard: Append only for stroke runs, not blend paths
          if grep -q 'packed\.Append\b' core/fpdfapi/render/veloce_path_display_list.cpp; then
            echo "ERROR: packed.Append found — Append must only appear in stroke_run_path context" >&2
            exit 1
          fi
          if grep -q 'DrawPath(stroke_run_path, nullptr' core/fpdfapi/render/veloce_path_display_list.cpp; then
            echo "ERROR: stroke-run DrawPath must preserve the path matrix" >&2
            exit 1
          fi
          if grep -q 'stroke_run_path\.Append(\*path, &path_matrix)' core/fpdfapi/render/veloce_path_display_list.cpp; then
            echo "ERROR: stroke-run Append must keep original path coordinates" >&2
            exit 1
          fi
          # deprecated symbols must be absent
          if grep -q 'DrawFillPathNodeWithBlendMask\|MaskBlendBatch\|FlushAllMaskBatches\|FlushPerNodePathBatch' \
              core/fpdfapi/render/veloce_path_display_list.cpp; then
            echo "ERROR: deprecated 0027/0028 symbols found in r34 build" >&2
            exit 1
          fi
          echo "All r37 blend group cancellation guards passed"

      - name: Link Android shared library
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build/pdfium"
          PDFIUM_AGG_SHRINK=1 \
            bash "$GITHUB_WORKSPACE/repo/scripts/ci/link_pdfium_android_agg_so.sh"

      - name: Verify exported symbols
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"

          LLVM_NM="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
          SO="$OUT_DIR/libpdfium.so"

          for api in \
              FPDF_RenderPageBitmap \
              FPDFEx_SetRenderAbort \
              FPDFEx_SetRenderCallbacks \
              FPDFEx_LoadPageWithClassification \
              FPDFEx_SetRenderSkipMask \
              FPDFEx_SetHugeImagePixelThreshold \
              ; do
            if ! "$LLVM_NM" -D --defined-only -C "$SO" 2>/dev/null \
                | grep -E " T $api(\b|@)" >/dev/null; then
              echo "MISSING exported $api in libpdfium.so" >&2
              exit 1
            fi
            echo "OK exported $api"
          done

      - name: Package artifact
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"

          mkdir -p "$DIST_DIR/include" "$DIST_DIR/patches"
          cp "$OUT_DIR/libpdfium.so" "$DIST_DIR/libpdfium.so"
          cp "$OUT_DIR/obj/libpdfium.a" "$DIST_DIR/libpdfium.a"
          cp -R public/. "$DIST_DIR/include/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0[1-9]-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0011-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0012-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0013-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0014-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0015-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0016-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0017-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0018-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0019-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0020-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0021-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0022-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0023-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0024-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0025-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0026-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0029-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0030-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0031-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0032-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0034-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0035-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0036-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0037-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0038-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0039-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0040-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0041-*.patch "$DIST_DIR/patches/"
          sha256sum "$DIST_DIR/libpdfium.so" > "$DIST_DIR/SHA256SUMS.txt"

          {
            printf 'pdfium_repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'pdfium_revision=%s\n' "$(git rev-parse HEAD)"
            printf 'renderer=agg\n'
            printf 'pgo=disabled\n'
            printf 'official_build=false\n'
            printf 'patches=patches/ship/01..09,0011,0012,0013,0014,0015,0016,0017,0018,0019,0020,0021,0022,0023,0024,0025,0026,0029,0030,0031,0032,0034,0035,0036,0037,0038,0039,0040,0041\n'
          } > "$DIST_DIR/build-info.txt"

      - name: Upload libpdfium artifact
        uses: actions/upload-artifact@v4
        with:
          name: libpdfium-android-arm64-r37-blend-group-cancellation-path-display-list
          path: artifacts/libpdfium-android-arm64-r37-blend-group-cancellation-path-display-list

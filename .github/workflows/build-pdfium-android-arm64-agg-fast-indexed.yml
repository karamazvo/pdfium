name: Build PDFium Android arm64 AGG + Fast Indexed/Separation CS

# Applies 0003 + 0004 + 0005 + 0007 + 0008.
#
# 0008 is the FIX -- precomputed BGR lookup tables for IndexedCS and
# SeparationCS. ~50-200x speedup per scanline on indexed-color images
# (the dominant case in print-prep PDFs, picture books, magazines).
# Colors are bit-identical to baseline.
#
# Includes 0004/0005/0007 markers so the resulting Perfetto trace
# shows pdfium.IndexedCS::TranslateImageLine firing instead of
# pdfium.ColorSpace::TranslateImageLine.baseSlow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install minimal host tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git curl python3 ca-certificates unzip zip file binutils rsync

      - name: Checkout depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$GITHUB_WORKSPACE/depot_tools"
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch PDFium fork with Android deps
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pdfium_build"
          cd "$GITHUB_WORKSPACE/pdfium_build"

          cat > .gclient <<GCLEOF
          solutions = [
            {
              "name": "pdfium",
              "url": "https://github.com/${{ github.repository }}.git",
              "managed": False,
              "revision": "${{ github.sha }}",
              "custom_deps": {},
              "custom_vars": {
                "checkout_android": True,
                "checkout_configuration": "default",
                "checkout_rust": False,
              },
            },
          ]
          target_os = ["android"]
          GCLEOF

          gclient sync --no-history

      - name: Patch public PDFium API exports
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          python3 "$GITHUB_WORKSPACE/repo/scripts/ci/patch_pdfium_public_exports.py"

      - name: Apply 0003 + 0004 + 0005 + 0007 + 0008 patches
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"

          mkdir -p patches/experiments
          for p in \
              0003-jpeg-downscale-on-decode.patch \
              0004-native-trace-markers.patch \
              0005-native-trace-markers-deep.patch \
              0007-colorspace-dispatch-markers.patch \
              0008-fast-indexed-separation-cs.patch \
              ; do
            cp "$GITHUB_WORKSPACE/repo/patches/experiments/$p" \
               "patches/experiments/$p"
          done

          bash "$GITHUB_WORKSPACE/repo/scripts/ci/apply_experiment_patches_fast_indexed.sh"

      - name: Generate GN args for AGG no-V8 build
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          mkdir -p out/android_arm64_agg

          cat > out/android_arm64_agg/args.gn <<'EOFARGS'
          target_os = "android"
          target_cpu = "arm64"

          is_debug = false
          is_component_build = false
          symbol_level = 0
          strip_debug_info = true
          treat_warnings_as_errors = false

          clang_use_chrome_plugins = false
          use_remoteexec = false

          pdf_enable_v8 = false
          pdf_enable_xfa = false

          pdf_use_skia = false
          pdf_use_agg = true

          pdf_is_complete_lib = true
          pdf_is_standalone = false

          pdf_enable_fontations = false
          pdf_enable_rust_png = false
          EOFARGS

          gn gen out/android_arm64_agg

      - name: Build static PDFium AGG
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          ninja -C out/android_arm64_agg pdfium -j"$(nproc)"

      - name: Verify all patches compiled in
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"

          LLVM_NM="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
          PDFIUM_A=out/android_arm64_agg/obj/libpdfium.a

          echo "=== ATrace_beginSection referenced ==="
          if "$LLVM_NM" -A "$PDFIUM_A" 2>/dev/null | grep -q 'ATrace_beginSection'; then
            echo "OK"
          else
            echo "ERROR: ATrace_beginSection NOT referenced" >&2
            exit 1
          fi

          echo
          echo "=== 0008 fast-path symbols present ==="
          # Look for the new override symbol -- CPDF_IndexedCS::TranslateImageLine
          if "$LLVM_NM" -A -C "$PDFIUM_A" 2>/dev/null \
              | grep -E 'CPDF_IndexedCS::TranslateImageLine' >/dev/null; then
            echo "OK CPDF_IndexedCS::TranslateImageLine symbol found"
          else
            echo "ERROR: CPDF_IndexedCS::TranslateImageLine override not in archive" >&2
            "$LLVM_NM" -A -C "$PDFIUM_A" 2>/dev/null | grep -i indexedcs | head -10
            exit 1
          fi
          if "$LLVM_NM" -A -C "$PDFIUM_A" 2>/dev/null \
              | grep -E 'CPDF_SeparationCS::TranslateImageLine' >/dev/null; then
            echo "OK CPDF_SeparationCS::TranslateImageLine symbol found"
          else
            echo "ERROR: CPDF_SeparationCS::TranslateImageLine override not in archive" >&2
            "$LLVM_NM" -A -C "$PDFIUM_A" 2>/dev/null | grep -i separationcs | head -10
            exit 1
          fi

          echo
          echo "=== 0008 slice strings present ==="
          for slice in \
              pdfium.IndexedCS::TranslateImageLine \
              pdfium.SeparationCS::TranslateImageLine \
              ; do
            if strings "$PDFIUM_A" 2>/dev/null | grep -Fq "$slice"; then
              echo "  OK $slice"
            else
              echo "  MISSING $slice" >&2
              exit 1
            fi
          done

      - name: Link final AGG libpdfium.so
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          bash "$GITHUB_WORKSPACE/repo/scripts/ci/link_pdfium_android_agg_so.sh"

      - name: Validate AGG libpdfium.so
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"

          LLVM_NM="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
          SO=out/android_arm64_agg/libpdfium.so

          if "$LLVM_NM" -D -C "$SO" 2>/dev/null \
            | grep ' U ' \
            | grep -E 'SkTypeface_proxy|SkFontMgr_New_Custom_Empty|SkLanguage::getParent|__real_|std::get_new_handler|__cxa_guard_|_Unwind_'; then
            echo "ERROR: unresolved known-bad symbols remain" >&2
            exit 1
          fi
          echo "OK no unresolved known-bad symbols"

          if ! "$LLVM_NM" -D -C "$SO" 2>/dev/null | grep -qE ' U ATrace_(beginSection|endSection)'; then
            echo "ERROR: ATrace_* not undefined-dynamic" >&2
            exit 1
          fi
          echo "OK ATrace_* present as runtime-resolved symbols"

          echo
          echo "Exported core APIs:"
          "$LLVM_NM" -D --defined-only -C "$SO" 2>/dev/null \
            | grep -E ' (FPDF_InitLibrary|FPDF_LoadDocument|FPDF_RenderPageBitmap)' \
            | head -10

      - name: Package artifact
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/arm64-v8a"
          VERSION="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}"

          cp out/android_arm64_agg/libpdfium.so "$GITHUB_WORKSPACE/artifacts/arm64-v8a/libpdfium.so"
          sha256sum "$GITHUB_WORKSPACE/artifacts/arm64-v8a/libpdfium.so" > "$GITHUB_WORKSPACE/artifacts/SHA256SUMS.txt"

          cat > "$GITHUB_WORKSPACE/artifacts/build-info.json" <<INFOEOF
          {
            "variant": "android-arm64-agg-no-v8-fast-indexed-separation",
            "renderer": "agg",
            "patches_applied": ["0003", "0004", "0005", "0007", "0008"],
            "jpeg_downscale": true,
            "fast_indexed_cs": true,
            "fast_separation_cs": true,
            "native_trace_markers": true,
            "ship_candidate": true,
            "notes": "Bit-identical colors vs baseline. ~50-200x speedup per scanline on indexed-color images. Trace markers remain compiled in (zero-cost when tracing disabled).",
            "commit": "${GITHUB_SHA}",
            "version": "$VERSION"
          }
          INFOEOF

      - name: Upload AGG + fast indexed CS libpdfium.so
        uses: actions/upload-artifact@v4
        with:
          name: libpdfium-android-arm64-agg-fast-indexed-separation
          path: artifacts/

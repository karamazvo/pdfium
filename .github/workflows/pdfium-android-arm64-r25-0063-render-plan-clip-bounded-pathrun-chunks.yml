name: r25-0063 RenderPlan clip-bounded PathRun chunks - Build libpdfium Android arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build libpdfium.so
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      WORK_ROOT: /tmp/pdfium-r25-0063-render-plan-clip-bounded-pathrun-chunks
      OUT_DIR: out/android_arm64_agg
      DIST_DIR: ${{ github.workspace }}/artifacts/libpdfium-android-arm64-r25-0063-render-plan-clip-bounded-pathrun-chunks

    steps:
      - name: Checkout PDFium patch repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            ca-certificates \
            curl \
            file \
            git \
            lsb-release \
            openjdk-17-jdk-headless \
            python3 \
            python3-pkg-resources \
            python3-setuptools \
            unzip \
            xz-utils \
            zip

      - name: Fetch depot_tools
        run: |
          mkdir -p "$WORK_ROOT"
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$WORK_ROOT/depot_tools"
          echo "$WORK_ROOT/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch PDFium fork with Android deps
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"

          mkdir -p "$WORK_ROOT/pdfium_build"
          cd "$WORK_ROOT/pdfium_build"

          cat > .gclient <<GCLEOF
          solutions = [
            {
              "name": "pdfium",
              "url": "https://github.com/${{ github.repository }}.git",
              "managed": False,
              "revision": "${{ github.sha }}",
              "custom_deps": {},
              "custom_vars": {
                "checkout_android": True,
                "checkout_configuration": "default",
                "checkout_rust": False,
              },
            },
          ]
          target_os = ["android"]
          GCLEOF

          gclient sync --no-history --nohooks

      - name: Patch public PDFium API exports
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"
          python3 "$GITHUB_WORKSPACE/repo/scripts/ci/patch_pdfium_public_exports.py"

      - name: Apply r25 + 0063 RenderPlan clip-bounded PathRun chunks patches
        run: |
          PDFIUM_DIR="$WORK_ROOT/pdfium_build/pdfium"
          for patch in \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0[1-9]-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0011-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0012-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0013-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0014-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0015-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0016-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0017-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0018-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0019-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0020-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0021-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0022-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0023-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0024-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0025-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0026-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0029-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0030-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0031-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0051-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0053-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0054-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0055-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0056-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0057-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0058-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0059-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0060-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0061-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0062-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0063-*.patch \
              ; do
            echo "Applying ${patch#$GITHUB_WORKSPACE/repo/}"
            git -C "$PDFIUM_DIR" apply --check "$patch"
            git -C "$PDFIUM_DIR" apply "$patch"
          done
          git -C "$PDFIUM_DIR" diff --check
          git -C "$PDFIUM_DIR" diff --stat

          if grep -RIE 'XPDF_ATRACE_SCOPED|ATrace_beginSection' \
              "$PDFIUM_DIR/core/" "$PDFIUM_DIR/fpdfsdk/" 2>/dev/null; then
              echo "ERROR: diagnostic ATrace markers present in r25-0063 build" >&2
            exit 1
          fi

      - name: Install PDFium build dependencies
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build/pdfium"
          build/install-build-deps.sh --android --no-prompt --unsupported

      - name: Run gclient hooks
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build"
          gclient runhooks

      - name: Generate GN files
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          PDFIUM_DIR="$WORK_ROOT/pdfium_build/pdfium"
          cd "$PDFIUM_DIR"
          gn gen "$OUT_DIR" --args='
            target_os = "android"
            target_cpu = "arm64"
            is_debug = false
            is_component_build = false
            strip_debug_info = true
            use_remoteexec = false
            symbol_level = 0
            treat_warnings_as_errors = false
            clang_use_chrome_plugins = false
            android_static_analysis = "off"
            pdf_is_standalone = false
            pdf_is_complete_lib = true
            pdf_use_skia = false
            pdf_use_agg = true
            pdf_enable_v8 = false
            pdf_enable_xfa = false
            pdf_enable_fontations = false
            pdf_enable_rust_png = false
            pdf_use_partition_alloc = false
            default_min_sdk_version = 23
          '
          gn args "$OUT_DIR" --list --short \
            | grep -E '^(target_os|target_cpu|pdf_enable_v8|pdf_enable_xfa|pdf_use_skia|pdf_use_agg|pdf_is_complete_lib|pdf_use_partition_alloc|default_min_sdk_version|pdf_enable_fontations|pdf_enable_rust_png) ='

      - name: Build static PDFium
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build/pdfium"
          ninja -C "$OUT_DIR" pdfium -j"$(nproc)"

      - name: Verify r25-0063 RenderPlan clip-bounded PathRun chunks patch contract
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"

          LLVM_NM="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
          PDFIUM_A="$OUT_DIR/obj/libpdfium.a"

          for api in \
              FPDFEx_SetRenderAbort \
              FPDFEx_SetRenderCallbacks \
              FPDFEx_LoadPageWithClassification \
              FPDFEx_SetRenderSkipMask \
              FPDFEx_SetHugeImagePixelThreshold \
              FPDFEx_GetPageDimensions \
              ; do
            if ! "$LLVM_NM" -A "$PDFIUM_A" 2>/dev/null \
                | grep -E " T $api(\b|@)" >/dev/null; then
              echo "MISSING $api in libpdfium.a" >&2
              exit 1
            fi
            echo "OK $api"
          done

          grep -q 'ShouldCancelRender' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'FPDFEX_FEATURE_PATH_DISPLAY_LIST_FORM' public/fpdfex_render_callbacks.h
          grep -q 'FPDFEx_GetPageDimensions' public/fpdfview.h
          grep -q 'static_assert(sizeof(FPDFEx_PageDimensions) == 32)' fpdfsdk/fpdf_view.cpp
          grep -q 'veloce_render_plan.cpp' core/fpdfapi/render/BUILD.gn
          grep -q 'veloce_render_plan.h' core/fpdfapi/render/BUILD.gn
          grep -q 'VeloceTryRenderPlanForHolder' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'VeloceTryRenderPlanForHolder' core/fpdfapi/render/cpdf_progressiverenderer.cpp
          grep -q 'VeloceTryRenderPathDisplayListForHolder' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'VeloceRenderPlanResult' core/fpdfapi/render/veloce_render_plan.h
          grep -q 'VeloceRenderPlanSegmentKind' core/fpdfapi/render/veloce_render_plan.h
          grep -q 'VeloceRenderPlanSegment' core/fpdfapi/render/veloce_render_plan.h
          grep -q 'VeloceBuildRenderPlanSkeletonForHolder' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'kPassthroughObject' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'first_object_index' core/fpdfapi/render/veloce_render_plan.h
          grep -q 'VeloceCompilePathDisplayListForObjectRange' core/fpdfapi/render/veloce_path_display_list.h
          grep -q 'CompilePathDisplayListRange' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'VeloceValidateCompiledPathDisplayListReplay' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'TryRenderSegmentedPlan' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'IsSafeTextPassthrough' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'RenderSingleObject(object, holder_to_device)' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'kMaxCachedRenderPlans = 64' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'RenderPlanCacheKey' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'FindCachedRenderPlan' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'ANDROID_LOG_INFO, "VeloceRenderPlan"' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'LogRenderPlanFacadeAttempt' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'RenderPlanShapeName' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'IsSinglePathRunPlan' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'TryRenderWholePathRunPlan' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'whole_path_run' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'legacy_holder_fallback' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'RenderPlanCostStats' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'planCache=%s' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'planLookupMs=%lld' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'segmentedMs=%lld' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'wholePathRunMs=%lld' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'legacyFallbackMs=%lld' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'totalMs=%lld' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'CompiledPathRunCacheKey' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'kMaxCachedCompiledPathRuns = 512' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'kMaxCachedCompiledPathRunNodes = 4000000' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'kMaxRenderPlanPathRunObjects = 8192' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'GetCompiledPathRunForSegment' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'compiledPathRunCacheHits=%zu' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'compiledPathRunCacheMisses=%zu' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'compiledPathRunNodes=%zu' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'LivePassthroughObjectTable' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'livePassthroughObjects=%zu' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'livePassthroughTableMs=%lld' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'has_holder_space_bbox' core/fpdfapi/render/veloce_render_plan.h
          grep -q 'holder_space_bbox' core/fpdfapi/render/veloce_render_plan.h
          grep -q 'SegmentOutsideClip' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'clipSkippedPathRuns=%zu' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'clipSkippedPathObjects=%zu' core/fpdfapi/render/veloce_render_plan.cpp
          if grep -q 'FindHolderObjectByIndex' core/fpdfapi/render/veloce_render_plan.cpp; then
            echo "ERROR: linear passthrough holder lookup helper remains in r25-0063 build" >&2
            exit 1
          fi
          grep -q 'VeloceCompiledPathDisplayListNodeCount' core/fpdfapi/render/veloce_path_display_list.h
          grep -q 'VeloceCompiledPathDisplayListNodeCount' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'StoreCachedRenderPlan' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'GetCachedRenderPlanForHolder' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'std::shared_ptr<const VeloceRenderPlan> plan' core/fpdfapi/render/veloce_render_plan.cpp
          grep -q 'PathDlSpatialIndex' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'BuildPathDlSpatialIndex' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'QuerySpatialIndexForReplay' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'spatialIndexCandidates=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'spatialIndexSkippedByTile=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'CanDrawBlendNodeWithMask' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'MaskRun' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'run_flush_end' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'FlushGroupRun' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'group_run_composites' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'groupRunComposites=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'FXDIB_Format::kBgra' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'SetDIBitsWithBlend' core/fpdfapi/render/veloce_path_display_list.cpp

          if grep -q 'PathDlSegmentKind\|kTextPassthrough\|StrokeRunFlushReason\|stroke_run_path\|sameArgbCrossed\|sameSourceDarken' \
              core/fpdfapi/render/veloce_path_display_list.cpp; then
            echo "ERROR: rolled-back post-r25 path-display-list behavior found in r25-0063 build" >&2
            exit 1
          fi
          if grep -q 'FlushMaskRun\|mask_run_composites\|maskRunComposites\|run_flush_overlap\|SetMaskBitsWithBlend\b' \
              core/fpdfapi/render/veloce_path_display_list.cpp; then
            echo "ERROR: old mask-run symbols found in r25-0063 build" >&2
            exit 1
          fi
          if grep -q 'DrawFillPathNodeWithBlendMask\|MaskBlendBatch\|FlushAllMaskBatches\|FlushPerNodePathBatch' \
              core/fpdfapi/render/veloce_path_display_list.cpp; then
            echo "ERROR: deprecated 0027/0028 symbols found in r25-0063 build" >&2
            exit 1
          fi
          echo "All r25 + 0051 + 0053 + 0054 + 0055 + 0056 + 0057 + 0058 + 0059 + 0060 + 0061 + 0062 + 0063 RenderPlan clip-bounded PathRun chunk guards passed"

      - name: Link Android shared library
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build/pdfium"
          PDFIUM_AGG_SHRINK=1 \
            bash "$GITHUB_WORKSPACE/repo/scripts/ci/link_pdfium_android_agg_so.sh"

      - name: Verify exported symbols
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"

          LLVM_NM="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
          SO="$OUT_DIR/libpdfium.so"

          for api in \
              FPDF_RenderPageBitmap \
              FPDFEx_SetRenderAbort \
              FPDFEx_SetRenderCallbacks \
              FPDFEx_LoadPageWithClassification \
              FPDFEx_SetRenderSkipMask \
              FPDFEx_SetHugeImagePixelThreshold \
              FPDFEx_GetPageDimensions \
              ; do
            if ! "$LLVM_NM" -D --defined-only -C "$SO" 2>/dev/null \
                | grep -E " T $api(\b|@)" >/dev/null; then
              echo "MISSING exported $api in libpdfium.so" >&2
              exit 1
            fi
            echo "OK exported $api"
          done

      - name: Package artifact
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"

          mkdir -p "$DIST_DIR/include" "$DIST_DIR/patches"
          cp "$OUT_DIR/libpdfium.so" "$DIST_DIR/libpdfium.so"
          cp "$OUT_DIR/obj/libpdfium.a" "$DIST_DIR/libpdfium.a"
          cp -R public/. "$DIST_DIR/include/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0[1-9]-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0011-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0012-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0013-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0014-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0015-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0016-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0017-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0018-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0019-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0020-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0021-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0022-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0023-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0024-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0025-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0026-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0029-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0030-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0031-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0051-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0053-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0054-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0055-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0056-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0057-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0058-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0059-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0060-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0061-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0062-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0063-*.patch "$DIST_DIR/patches/"
          sha256sum "$DIST_DIR/libpdfium.so" > "$DIST_DIR/SHA256SUMS.txt"

          {
            printf 'release=r25-0063-render-plan-clip-bounded-pathrun-chunks\n'
            printf 'pdfium_repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'pdfium_revision=%s\n' "$(git rev-parse HEAD)"
            printf 'renderer=agg\n'
            printf 'pgo=disabled\n'
            printf 'official_build=false\n'
            printf 'rendering_base=r25\n'
            printf 'page_dimensions_api=0051\n'
            printf 'render_plan_interface=0053\n'
            printf 'render_plan_skeleton=0054\n'
            printf 'segmented_text_passthrough=0055\n'
            printf 'render_plan_cache=0056\n'
            printf 'holder_space_spatial_index=0057\n'
            printf 'render_plan_facade_telemetry=0058\n'
            printf 'render_plan_whole_path_run_backend=0059\n'
            printf 'render_plan_cost_telemetry=0060\n'
            printf 'render_plan_compiled_pathrun_cache=0061\n'
            printf 'render_plan_live_passthrough_table=0062\n'
            printf 'render_plan_clip_bounded_pathrun_chunks=0063\n'
            printf 'patches=patches/ship/01..09,0011,0012,0013,0014,0015,0016,0017,0018,0019,0020,0021,0022,0023,0024,0025,0026,0029,0030,0031,0051,0053,0054,0055,0056,0057,0058,0059,0060,0061,0062,0063\n'
            printf 'excluded_post_r25_behavior=0032,0034,0035,0036,0037,0038,0039,0040,0041,0042,0043,0044,0045,0046,0047,0048,0049,0050,0052\n'
          } > "$DIST_DIR/build-info.txt"

      - name: Upload libpdfium artifact
        uses: actions/upload-artifact@v4
        with:
          name: libpdfium-android-arm64-r25-0063-render-plan-clip-bounded-pathrun-chunks
          path: artifacts/libpdfium-android-arm64-r25-0063-render-plan-clip-bounded-pathrun-chunks

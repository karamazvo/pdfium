name: Build PDFium Android arm64 Skia

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install minimal host tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git curl python3 ca-certificates unzip zip file binutils rsync

      - name: Checkout depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$GITHUB_WORKSPACE/depot_tools"
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch PDFium fork with Android deps
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pdfium_build"
          cd "$GITHUB_WORKSPACE/pdfium_build"

          cat > .gclient <<GCLEOF
          solutions = [
            {
              "name": "pdfium",
              "url": "https://github.com/${{ github.repository }}.git",
              "managed": False,
              "revision": "${{ github.sha }}",
              "custom_deps": {},
              "custom_vars": {
                "checkout_android": True,
                "checkout_configuration": "default",
                "checkout_rust": False,
              },
            },
          ]
          target_os = ["android"]
          GCLEOF

          gclient sync --no-history

      - name: Patch clean PDFium for Android Skia
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          python3 "$GITHUB_WORKSPACE/repo/scripts/ci/patch_pdfium_android_skia.py"

      - name: Generate GN args
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          mkdir -p out/android_arm64

          cat > out/android_arm64/args.gn <<'EOFARGS'
          target_os = "android"
          target_cpu = "arm64"

          is_debug = false
          is_component_build = false
          symbol_level = 0
          strip_debug_info = true
          treat_warnings_as_errors = false

          clang_use_chrome_plugins = false
          use_remoteexec = false

          pdf_enable_v8 = false
          pdf_enable_xfa = false
          pdf_use_skia = true
          pdf_use_agg = false
          pdf_is_complete_lib = true
          pdf_is_standalone = false

          pdf_enable_fontations = false
          pdf_enable_rust_png = false
          EOFARGS

          gn gen out/android_arm64
          gn args out/android_arm64 --list --short | grep -E 'pdf_use_skia|pdf_use_agg|pdf_enable_v8|pdf_enable_xfa|pdf_is_complete_lib'

      - name: Build static PDFium
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          ninja -C out/android_arm64 pdfium -j"$(nproc)"

      - name: Link final libpdfium.so
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          bash "$GITHUB_WORKSPACE/repo/scripts/ci/link_pdfium_android_so.sh"

      - name: Validate libpdfium.so
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"

          LLVM_NM="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
          SO=out/android_arm64/libpdfium.so

          echo "=== No unresolved known-bad symbols ==="
          if "$LLVM_NM" -D -C "$SO" 2>/dev/null \
            | grep ' U ' \
            | grep -E 'SkTypeface_proxy|SkFontMgr_New_Custom_Empty|SkFontMgr_Android_Parser|SkLanguage::getParent|__real_|std::get_new_handler|__cxa_guard_|_Unwind_'; then
            exit 1
          fi

          echo "=== Exported PDFium APIs ==="
          "$LLVM_NM" -D --defined-only -C "$SO" 2>/dev/null \
            | grep -E ' (FPDF_InitLibrary|FPDF_InitLibraryWithConfig|FPDF_LoadDocument|FPDF_RenderPageBitmap)' \
            | head -20

          readelf -d "$SO" | grep NEEDED || true

      - name: Package artifact
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/arm64-v8a"

          VERSION="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}"
          cp out/android_arm64/libpdfium.so "$GITHUB_WORKSPACE/artifacts/arm64-v8a/libpdfium.so"
          sha256sum "$GITHUB_WORKSPACE/artifacts/arm64-v8a/libpdfium.so" > "$GITHUB_WORKSPACE/artifacts/SHA256SUMS.txt"

          cat > "$GITHUB_WORKSPACE/artifacts/build-info.json" <<INFOEOF
          {
            "variant": "android-arm64-skia-no-v8-no-xfa",
            "commit": "${GITHUB_SHA}",
            "version": "$VERSION"
          }
          INFOEOF

      - name: Upload libpdfium.so
        uses: actions/upload-artifact@v4
        with:
          name: libpdfium-android-arm64-skia-no-v8
          path: artifacts/

name: Release Size Experiment (4 variants, side-by-side)

# ===========================================================================
# Measures the .so size impact of three independent size-shrink levers,
# all relative to the existing release config. Builds four .so files in
# one CI run on the same PDFium SHA / same 3 ship patches:
#
#   variant_baseline -- current release config, no extra strip
#   variant_a        -- baseline + `llvm-strip --strip-unneeded`
#   variant_b        -- A + `pdf_use_partition_alloc = false` in args.gn
#   variant_c        -- B + drop --whole-archive, add --gc-sections at link
#                       (this is now the production ship config; ~6.6 MB,
#                        roughly matches bblanchon/pdfium-binaries 6.4 MB)
#
# All four use the same patches/ship/01..03 and the same PDFium SHA, so
# size differences are 100% attributable to the build/link levers.
#
# Output: 4 .so files + 4 sha256 hashes + a size-report.txt comparing
# them. Variant C is the current shipping config; this workflow now
# serves as a regression-tracking harness — if a future PDFium roll or
# refactor changes the size profile, rerun it to see which lever moved.
#
# Manual trigger only.
# ===========================================================================

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install minimal host tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git curl python3 ca-certificates unzip zip file binutils rsync

      - name: Checkout depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$GITHUB_WORKSPACE/depot_tools"
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch PDFium fork with Android deps
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pdfium_build"
          cd "$GITHUB_WORKSPACE/pdfium_build"

          cat > .gclient <<GCLEOF
          solutions = [
            {
              "name": "pdfium",
              "url": "https://github.com/${{ github.repository }}.git",
              "managed": False,
              "revision": "${{ github.sha }}",
              "custom_deps": {},
              "custom_vars": {
                "checkout_android": True,
                "checkout_configuration": "default",
                "checkout_rust": False,
              },
            },
          ]
          target_os = ["android"]
          GCLEOF

          gclient sync --no-history

      - name: Patch public PDFium API exports
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          python3 "$GITHUB_WORKSPACE/repo/scripts/ci/patch_pdfium_public_exports.py"

      - name: Apply ship patches (01, 02, 03)
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"

          mkdir -p patches/ship
          for p in \
              01-jpeg-downscale-on-decode.patch \
              02-indexed-separation-fast.patch \
              03-devicen-fast.patch \
              ; do
            cp "$GITHUB_WORKSPACE/repo/patches/ship/$p" "patches/ship/$p"
          done

          for p in patches/ship/01-jpeg-downscale-on-decode.patch \
                   patches/ship/02-indexed-separation-fast.patch \
                   patches/ship/03-devicen-fast.patch \
                   ; do
            echo "=== Apply $p ==="
            git apply --check "$p"
            git apply "$p"
          done

          # Guard: confirm no diagnostic ATrace leaks (same guard as
          # the production release workflow).
          if grep -RIE 'XPDF_ATRACE_SCOPED|ATrace_beginSection' \
              core/ fpdfsdk/ 2>/dev/null; then
            echo "ERROR: diagnostic markers present" >&2
            exit 1
          fi

      # ----------------------------------------------------------------
      # The four variants are built sequentially, each into its own
      # out/ subdirectory. We invoke `gn gen` + `ninja` per variant,
      # then link + (optionally) strip into artifacts/<variant>/.
      # ----------------------------------------------------------------

      - name: Variant BASELINE -- gn gen + build (current release args)
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          mkdir -p out/variant_baseline
          cat > out/variant_baseline/args.gn <<'EOFARGS'
          target_os = "android"
          target_cpu = "arm64"

          is_debug = false
          is_component_build = false
          symbol_level = 0
          strip_debug_info = true
          treat_warnings_as_errors = false

          clang_use_chrome_plugins = false
          use_remoteexec = false

          pdf_enable_v8 = false
          pdf_enable_xfa = false

          pdf_use_skia = false
          pdf_use_agg = true

          pdf_is_complete_lib = true
          pdf_is_standalone = false

          pdf_enable_fontations = false
          pdf_enable_rust_png = false
          EOFARGS
          gn gen out/variant_baseline
          ninja -C out/variant_baseline pdfium -j"$(nproc)"

      - name: Variant BASELINE -- link (current link script, no extra strip)
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          # The link script now respects PDFIUM_AGG_BUILD_DIR.
          PDFIUM_AGG_BUILD_DIR=out/variant_baseline \
            bash "$GITHUB_WORKSPACE/repo/scripts/ci/link_pdfium_android_agg_so.sh"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/baseline/arm64-v8a"
          cp out/variant_baseline/libpdfium.so \
             "$GITHUB_WORKSPACE/artifacts/baseline/arm64-v8a/libpdfium.so"

      - name: Variant A -- relink existing build + llvm-strip --strip-unneeded
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          LLVM_NM="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
          LLVM_STRIP="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-strip"

          # Variant A uses the same build artifacts as BASELINE but
          # additionally strips the final .so. So we copy the baseline
          # .so and run strip on it. No relink needed.
          mkdir -p "$GITHUB_WORKSPACE/artifacts/variant_a/arm64-v8a"
          cp "$GITHUB_WORKSPACE/artifacts/baseline/arm64-v8a/libpdfium.so" \
             "$GITHUB_WORKSPACE/artifacts/variant_a/arm64-v8a/libpdfium.so"

          # BEFORE stripping: verify the ship-patch overrides are present
          # as symbols. After llvm-strip --strip-unneeded, local C++
          # virtual-table function symbols are removed (code stays but
          # symbol names are gone), so the same nm check would yield a
          # false-positive "missing" result on the stripped .so.
          for sym in 'CPDF_IndexedCS::TranslateImageLine' \
                     'CPDF_SeparationCS::TranslateImageLine' \
                     'CPDF_DeviceNCS::TranslateImageLine' \
                     ; do
            if ! "$LLVM_NM" -C \
                "$GITHUB_WORKSPACE/artifacts/variant_a/arm64-v8a/libpdfium.so" 2>/dev/null \
                | grep -F "$sym" >/dev/null; then
              echo "FATAL: variant_a pre-strip missing $sym" >&2
              exit 1
            fi
          done

          "$LLVM_STRIP" --strip-unneeded \
            "$GITHUB_WORKSPACE/artifacts/variant_a/arm64-v8a/libpdfium.so"

      - name: Variant B -- gn gen with partition_alloc=false + build + strip
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          LLVM_STRIP="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-strip"

          mkdir -p out/variant_b
          cat > out/variant_b/args.gn <<'EOFARGS'
          target_os = "android"
          target_cpu = "arm64"

          is_debug = false
          is_component_build = false
          symbol_level = 0
          strip_debug_info = true
          treat_warnings_as_errors = false

          clang_use_chrome_plugins = false
          use_remoteexec = false

          pdf_enable_v8 = false
          pdf_enable_xfa = false

          pdf_use_skia = false
          pdf_use_agg = true

          pdf_is_complete_lib = true
          pdf_is_standalone = false

          pdf_enable_fontations = false
          pdf_enable_rust_png = false

          # Variant B lever: disable partition_alloc.
          # System allocator (malloc/new) is used instead. Should be a
          # transparent change for code that simply allocates memory.
          pdf_use_partition_alloc = false

          # Match bblanchon/pdfium-binaries: target Android API 23 as
          # the baseline. The clang driver omits __INTRODUCED_IN_<api>
          # availability shims for APIs already present at the baseline,
          # shaving a small amount of code (~50-100 KB). Functionally
          # equivalent to our link's `--target=aarch64-linux-android29`
          # because the runtime device is API >= 29; this lever only
          # affects what the compiler considers "the new stuff."
          default_min_sdk_version = 23
          EOFARGS
          gn gen out/variant_b
          ninja -C out/variant_b pdfium -j"$(nproc)"

          PDFIUM_AGG_BUILD_DIR=out/variant_b \
            bash "$GITHUB_WORKSPACE/repo/scripts/ci/link_pdfium_android_agg_so.sh"

          mkdir -p "$GITHUB_WORKSPACE/artifacts/variant_b/arm64-v8a"
          cp out/variant_b/libpdfium.so \
             "$GITHUB_WORKSPACE/artifacts/variant_b/arm64-v8a/libpdfium.so"

          # Verify the ship-patch overrides survived link BEFORE we
          # strip the .so (strip removes virtual-table local symbol
          # names even though the code is still present).
          LLVM_NM="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
          for sym in 'CPDF_IndexedCS::TranslateImageLine' \
                     'CPDF_SeparationCS::TranslateImageLine' \
                     'CPDF_DeviceNCS::TranslateImageLine' \
                     ; do
            if ! "$LLVM_NM" -C \
                "$GITHUB_WORKSPACE/artifacts/variant_b/arm64-v8a/libpdfium.so" 2>/dev/null \
                | grep -F "$sym" >/dev/null; then
              echo "FATAL: variant_b pre-strip missing $sym" >&2
              exit 1
            fi
          done

          "$LLVM_STRIP" --strip-unneeded \
            "$GITHUB_WORKSPACE/artifacts/variant_b/arm64-v8a/libpdfium.so"

      - name: Variant C -- B + custom link (no --whole-archive, +--gc-sections)
        run: |
          cd "$GITHUB_WORKSPACE/pdfium_build/pdfium"
          LLVM_STRIP="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-strip"
          LLVM_NM="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-nm"

          # Reuses out/variant_b/ build artifacts (same args.gn).
          OUT=out/variant_b
          PDFIUM_A="$OUT/obj/libpdfium.a"
          SO="$OUT/libpdfium.variant_c.so"
          CC="third_party/llvm-build/Release+Asserts/bin/clang"
          TARGET="aarch64-linux-android29"
          SYSROOT="third_party/android_toolchain/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          BUILTINS="third_party/llvm-build/Release+Asserts/lib/clang/23/lib/linux/libclang_rt.builtins-aarch64-android.a"

          # Filesystem-based discovery (PDFium now uses source_sets,
          # so `gn desc <target> outputs` errors with
          # "Don't know how to display outputs for source_set". The
          # filesystem walk is more robust.)
          mapfile -t PROJECT_ARCHIVES_UNIQ < <(
            find "$OUT/obj" -type f -name '*.a' 2>/dev/null \
              | grep -v "^${OUT}/obj/libpdfium\.a$" \
              | sort -u
          )
          echo "Variant C: PROJECT_ARCHIVES_UNIQ has ${#PROJECT_ARCHIVES_UNIQ[@]} entries"

          # Read .ninja rule files from libunwind/libc++/libc++abi
          # source_sets, force-build their .o outputs, then collect
          # them. Same approach as link_pdfium_android_agg_so.sh --
          # see comments there for rationale.
          RUNTIME_RESOLUTION_TARGETS=()
          for nf in \
              "$OUT/obj/buildtools/third_party/libunwind/libunwind.ninja" \
              "$OUT/obj/buildtools/third_party/libc++/libc++.ninja" \
              "$OUT/obj/buildtools/third_party/libc++abi/libc++abi.ninja" \
              ; do
            [ -f "$nf" ] || continue
            while IFS= read -r tgt; do
              [ -z "$tgt" ] && continue
              RUNTIME_RESOLUTION_TARGETS+=("$tgt")
            done < <(
              grep -E '^build [^:]+\.o:' "$nf" \
                | sed -E 's/^build ([^:]+\.o):.*/\1/'
            )
          done
          if [ "${#RUNTIME_RESOLUTION_TARGETS[@]}" -gt 0 ]; then
            mapfile -t RUNTIME_RESOLUTION_TARGETS < <(
              printf '%s\n' "${RUNTIME_RESOLUTION_TARGETS[@]}" | sort -u
            )
            echo "Variant C: building ${#RUNTIME_RESOLUTION_TARGETS[@]} runtime .o targets"
            ninja -C "$OUT" "${RUNTIME_RESOLUTION_TARGETS[@]}" 2>&1 | tail -5 || true
          fi
          mapfile -t LIBUNWIND_OBJECTS < <(
            find "$OUT/obj" -type f -name '*.o' 2>/dev/null | grep '/libunwind/' | sort -u
          )
          mapfile -t LIBCXX_OBJECTS < <(
            find "$OUT/obj" -type f -name '*.o' 2>/dev/null | grep '/libc++/' | grep -v 'libc++abi' | sort -u
          )
          mapfile -t LIBCXXABI_OBJECTS < <(
            find "$OUT/obj" -type f -name '*.o' 2>/dev/null | grep '/libc++abi/' | sort -u
          )
          echo "Variant C runtime: libunwind=${#LIBUNWIND_OBJECTS[@]}, libc++=${#LIBCXX_OBJECTS[@]}, libc++abi=${#LIBCXXABI_OBJECTS[@]}"
          if [ "${#LIBUNWIND_OBJECTS[@]}" -eq 0 ] \
             || [ "${#LIBCXX_OBJECTS[@]}" -eq 0 ] \
             || [ "${#LIBCXXABI_OBJECTS[@]}" -eq 0 ]; then
            echo "ERROR: Variant C missing runtime .o files" >&2
            exit 1
          fi
          LIBUNWIND_LINK_FLAGS=(
            "${LIBUNWIND_OBJECTS[@]}"
            "${LIBCXX_OBJECTS[@]}"
            "${LIBCXXABI_OBJECTS[@]}"
          )

          # Variant C link levers:
          #  - drop -Wl,--whole-archive on $PDFIUM_A (let linker GC dead code)
          #  - add -Wl,--gc-sections (free unreferenced sections)
          #  - Keep public APIs alive via --export-dynamic-symbol FPDF* / FORM_*
          #    and explicit --undefined for InitLibrary entry points (same as
          #    the existing link script).
          #
          # If any FPDF/FORM symbol is missing in the final .so it means
          # the linker GC'd too aggressively. We verify that below.

          # --wrap is only needed when partition_alloc's allocator_shim
          # is linked (Variant B disables partition_alloc, so Variant C
          # also does -- nothing provides __wrap_realpath / __wrap_getcwd).
          WRAP_FLAGS=()
          if printf '%s\n' "${PROJECT_ARCHIVES_UNIQ[@]}" | grep -q 'liballocator_shim\.a'; then
            WRAP_FLAGS=(-Wl,--wrap=getcwd -Wl,--wrap=realpath)
            echo "Variant C: liballocator_shim present -> using --wrap"
          else
            echo "Variant C: liballocator_shim NOT present -> dropping --wrap"
          fi

          # Build the full list of public FPDF_* and FORM_* symbols
          # from libpdfium.a. Each must be passed as -Wl,--undefined to
          # survive --gc-sections. Without this, only the ~10 hand-
          # listed APIs are kept and dlopen fails with errors like:
          #   cannot locate symbol "FPDFText_LoadPage"
          # The JNI wrapper (libpdfiumandroid.so) imports many more
          # FPDF_* APIs than we can hand-maintain a list of.
          UNDEFINED_FLAGS=()
          while IFS= read -r sym; do
            UNDEFINED_FLAGS+=("-Wl,--undefined=$sym")
          done < <(
            "$LLVM_NM" -A --defined-only "$PDFIUM_A" 2>/dev/null \
              | awk '{print $NF}' \
              | grep -E '^(FPDF|FORM_|FSDK_)' \
              | sort -u
          )
          echo "Variant C: preserving ${#UNDEFINED_FLAGS[@]} FPDF_*/FORM_*/FSDK_* symbols from libpdfium.a"

          "$CC" \
            --target="$TARGET" \
            --sysroot="$SYSROOT" \
            -shared \
            -o "$SO" \
            -nostdlib++ \
            --unwindlib=none \
            "$PDFIUM_A" \
            -Wl,--start-group \
              "${PROJECT_ARCHIVES_UNIQ[@]}" \
              "${LIBUNWIND_LINK_FLAGS[@]}" \
            -Wl,--end-group \
            "$BUILTINS" \
            -Wl,--no-undefined \
            -Wl,--gc-sections \
            -Wl,--export-dynamic-symbol=FPDF* \
            -Wl,--export-dynamic-symbol=FORM_* \
            "${UNDEFINED_FLAGS[@]}" \
            "${WRAP_FLAGS[@]}" \
            -Wl,-z,max-page-size=16384 \
            -llog -landroid -ldl -lm

          # Sanity 1: confirm a broad set of public APIs survived the
          # GC. The 0517 test build crashed at dlopen time with
          # "cannot locate symbol FPDFText_LoadPage" -- the JNI
          # wrapper imports many APIs from families we didn't
          # explicitly preserve. Include one canonical symbol from
          # every public PDFium header family.
          MISSING_APIS=()
          for api in \
              FPDF_InitLibrary FPDF_InitLibraryWithConfig \
              FPDF_LoadDocument FPDF_LoadMemDocument \
              FPDF_RenderPageBitmap FPDF_RenderPageBitmapWithMatrix \
              FPDF_GetPageCount FPDF_LoadPage FPDF_ClosePage \
              FPDF_CloseDocument FPDF_DestroyLibrary \
              FPDFText_LoadPage FPDFText_CountChars FPDFText_GetCharBox \
              FPDFAnnot_GetSubtype FPDFAnnot_GetRect FPDFAnnot_CountAttachmentPoints \
              FPDFLink_LoadWebLinks FPDFLink_GetURL FPDFLink_GetTextRange \
              FPDFBookmark_GetFirstChild FPDFBookmark_GetTitle \
              FPDFDest_GetDestPageIndex \
              FPDFAction_GetType FPDFAction_GetURIPath \
              FPDFDoc_GetPageMode FPDFDoc_GetAttachmentCount \
              FPDF_GetMetaText FPDF_GetFileVersion FPDF_GetSecurityHandlerRevision \
              FPDFPage_GetRotation FPDFPage_HasTransparency \
              FPDFPageObj_GetType FPDFPage_CountObjects \
              FPDFImageObj_GetImagePixelSize \
              FPDF_StructTree_GetForPage FPDF_StructElement_GetType \
              FPDF_GetPageSizeByIndex \
              FORM_OnLButtonDown FORM_OnKeyDown FORM_DoDocumentOpenAction \
              ; do
            if ! "$LLVM_NM" -D --defined-only -C "$SO" 2>/dev/null \
                | grep -E " T $api(\b|@)" >/dev/null; then
              MISSING_APIS+=("$api")
            fi
          done
          if [ "${#MISSING_APIS[@]}" -gt 0 ]; then
            echo "ERROR: Variant C GC'd these public APIs:" >&2
            printf '  %s\n' "${MISSING_APIS[@]}" >&2
            echo "The auto-generated UNDEFINED_FLAGS should have caught these." >&2
            echo "Check the link command -- one of:" >&2
            echo "  - libpdfium.a doesn't actually define them" >&2
            echo "  - llvm-nm's output format is unexpected" >&2
            exit 1
          fi

          # Sanity 2: confirm the 3 ship-patch overrides survived.
          # These are virtual-table entries (override an existing
          # virtual in CPDF_ColorSpace), so the vtable for each
          # subclass must reference them -- as long as the subclass
          # itself isn't GC'd, the override symbol must exist.
          # If --gc-sections drops a colorspace subclass entirely,
          # PDFium would silently fall back to the slow base-class
          # path on every image that uses that colorspace -- a
          # functional REGRESSION (slow renders) rather than a
          # link failure. So we have to check explicitly.
          MISSING_OVERRIDES=()
          for sym in 'CPDF_IndexedCS::TranslateImageLine' \
                     'CPDF_SeparationCS::TranslateImageLine' \
                     'CPDF_DeviceNCS::TranslateImageLine' \
                     ; do
            if ! "$LLVM_NM" -C "$SO" 2>/dev/null \
                | grep -F "$sym" >/dev/null; then
              MISSING_OVERRIDES+=("$sym")
            fi
          done
          if [ "${#MISSING_OVERRIDES[@]}" -gt 0 ]; then
            echo "ERROR: Variant C --gc-sections dropped these ship-patch overrides:" >&2
            printf '  %s\n' "${MISSING_OVERRIDES[@]}" >&2
            echo "These are virtual-table entries; if they're gone the linker GC'd" >&2
            echo "their entire subclass and PDFium will fall back to the slow base" >&2
            echo "path -- functional regression, NOT a build failure normally." >&2
            echo "Add corresponding -Wl,--undefined entries to keep them alive." >&2
            exit 1
          fi

          # Sanity 3: confirm the source still has the build patches
          # applied. Catches the rare case where a patch silently
          # reverted between Apply and Variant C link.
          for pat in 'CPDF_IndexedCS::BuildBgrLookupTableIfNeeded' \
                     'CPDF_SeparationCS::BuildBgrLookupTableIfNeeded' \
                     'CPDF_DeviceNCS::BuildBgrLookupTableIfNeeded' \
                     ; do
            if ! grep -RFq "$pat" \
                core/fpdfapi/page/cpdf_indexedcs.cpp \
                core/fpdfapi/page/cpdf_colorspace.cpp 2>/dev/null; then
              echo "ERROR: Variant C source missing patch helper: $pat" >&2
              exit 1
            fi
          done

          mkdir -p "$GITHUB_WORKSPACE/artifacts/variant_c/arm64-v8a"
          cp "$SO" "$GITHUB_WORKSPACE/artifacts/variant_c/arm64-v8a/libpdfium.so"
          "$LLVM_STRIP" --strip-unneeded \
            "$GITHUB_WORKSPACE/artifacts/variant_c/arm64-v8a/libpdfium.so"

          # Final survival check on the STRIPPED .so. llvm-strip can
          # discard symbols that --gc-sections kept. We need the
          # overrides AND the public APIs to be present after stripping.
          SO_STRIPPED="$GITHUB_WORKSPACE/artifacts/variant_c/arm64-v8a/libpdfium.so"
          POST_STRIP_MISSING=()
          for api in FPDF_InitLibrary FPDF_LoadDocument FPDF_RenderPageBitmap; do
            if ! "$LLVM_NM" -D --defined-only -C "$SO_STRIPPED" 2>/dev/null \
                | grep -E " T $api(\b|@)" >/dev/null; then
              POST_STRIP_MISSING+=("$api")
            fi
          done
          if [ "${#POST_STRIP_MISSING[@]}" -gt 0 ]; then
            echo "ERROR: Variant C post-strip dropped public APIs:" >&2
            printf '  %s\n' "${POST_STRIP_MISSING[@]}" >&2
            exit 1
          fi

      - name: Generate size report
        run: |
          cd "$GITHUB_WORKSPACE/artifacts"

          {
            echo "=========================================="
            echo "PDFium Android arm64 size experiment"
            echo "=========================================="
            echo "Commit: $GITHUB_SHA"
            echo "PDFium ship patches: 01, 02, 03"
            echo ""
            echo "Variant sizes (bytes / human-readable):"
            echo ""
            printf "%-12s %15s   %s\n" "VARIANT" "BYTES" "DESCRIPTION"
            printf "%-12s %15s   %s\n" "--------" "-----" "-----------"
            for v in baseline variant_a variant_b variant_c; do
              SO="$v/arm64-v8a/libpdfium.so"
              if [ -f "$SO" ]; then
                BYTES=$(stat -c %s "$SO")
                HUMAN=$(ls -lh "$SO" | awk '{print $5}')
                case "$v" in
                  baseline)  DESC="current release: complete_lib + whole-archive, no strip" ;;
                  variant_a) DESC="baseline + llvm-strip --strip-unneeded" ;;
                  variant_b) DESC="A + pdf_use_partition_alloc=false" ;;
                  variant_c) DESC="B + drop --whole-archive + --gc-sections (ship config)" ;;
                esac
                printf "%-12s %15s   %s  [%s]\n" "$v" "$BYTES" "$HUMAN" "$DESC"
              else
                printf "%-12s %15s   %s\n" "$v" "MISSING" "(build failed)"
              fi
            done
            echo ""
            echo "Deltas vs baseline:"
            if [ -f baseline/arm64-v8a/libpdfium.so ]; then
              B=$(stat -c %s baseline/arm64-v8a/libpdfium.so)
              for v in variant_a variant_b variant_c; do
                SO="$v/arm64-v8a/libpdfium.so"
                if [ -f "$SO" ]; then
                  X=$(stat -c %s "$SO")
                  DELTA=$((X - B))
                  PCT=$(awk "BEGIN{printf \"%.1f\", ($X - $B) / $B * 100}")
                  printf "  %-12s %15s bytes (%s%%)\n" "$v" "$DELTA" "$PCT"
                fi
              done
            fi
            echo ""
            echo "SHA-256 of each .so:"
            for v in baseline variant_a variant_b variant_c; do
              SO="$v/arm64-v8a/libpdfium.so"
              if [ -f "$SO" ]; then
                sha256sum "$SO"
              fi
            done
            echo ""
            echo "Public API spot-check (each variant should export FPDF_RenderPageBitmap):"
            LLVM_NM="$GITHUB_WORKSPACE/pdfium_build/pdfium/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
            for v in baseline variant_a variant_b variant_c; do
              SO="$v/arm64-v8a/libpdfium.so"
              if [ -f "$SO" ]; then
                if "$LLVM_NM" -D --defined-only -C "$SO" 2>/dev/null \
                    | grep -qE ' T FPDF_RenderPageBitmap\b'; then
                  echo "  $v: FPDF_RenderPageBitmap OK"
                else
                  echo "  $v: FPDF_RenderPageBitmap MISSING -- broken build" >&2
                fi
              fi
            done
            echo ""
            echo "Ship-patch override pre-strip verification:"
            echo "  Each variant's pre-strip step already verified that"
            echo "  the 3 colorspace TranslateImageLine overrides are"
            echo "  present BEFORE llvm-strip --strip-unneeded ran."
            echo "  (Post-strip the symbol names disappear because the"
            echo "  overrides are virtual-table-only references; the"
            echo "  code is still present and reachable via the vtable.)"
            echo "  If you saw 'FATAL: variant_X pre-strip missing ...'"
            echo "  above, the override was GC'd at link time."
          } | tee size-report.txt

      - name: Upload all four variants + size report
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-android-arm64-size-experiment
          path: artifacts/

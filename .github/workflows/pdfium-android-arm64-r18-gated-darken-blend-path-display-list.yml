name: Build patched PDFium Android arm64 r18 gated darken blend path display-list

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build libpdfium.so
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      WORK_ROOT: /tmp/pdfium-r18
      OUT_DIR: out/android_arm64_agg
      DIST_DIR: ${{ github.workspace }}/artifacts/libpdfium-android-arm64-r18-gated-darken-blend-path-display-list

    steps:
      - name: Checkout PDFium patch repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            ca-certificates \
            curl \
            file \
            git \
            lsb-release \
            openjdk-17-jdk-headless \
            python3 \
            python3-pkg-resources \
            python3-setuptools \
            unzip \
            xz-utils \
            zip

      - name: Fetch depot_tools
        run: |
          mkdir -p "$WORK_ROOT"
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$WORK_ROOT/depot_tools"
          echo "$WORK_ROOT/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch PDFium fork with Android deps
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"

          mkdir -p "$WORK_ROOT/pdfium_build"
          cd "$WORK_ROOT/pdfium_build"

          cat > .gclient <<GCLEOF
          solutions = [
            {
              "name": "pdfium",
              "url": "https://github.com/${{ github.repository }}.git",
              "managed": False,
              "revision": "${{ github.sha }}",
              "custom_deps": {},
              "custom_vars": {
                "checkout_android": True,
                "checkout_configuration": "default",
                "checkout_rust": False,
              },
            },
          ]
          target_os = ["android"]
          GCLEOF

          gclient sync --no-history --nohooks

      - name: Patch public PDFium API exports
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"
          python3 "$GITHUB_WORKSPACE/repo/scripts/ci/patch_pdfium_public_exports.py"

      - name: Apply xPDFSDK PDFium patches
        run: |
          PDFIUM_DIR="$WORK_ROOT/pdfium_build/pdfium"
          for patch in \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0[1-9]-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0011-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0012-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0013-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0014-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0015-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0016-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0017-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0018-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0019-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0020-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0021-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0022-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0023-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0024-*.patch \
              ; do
            echo "Applying ${patch#$GITHUB_WORKSPACE/repo/}"
            git -C "$PDFIUM_DIR" apply --check "$patch"
            git -C "$PDFIUM_DIR" apply "$patch"
          done
          git -C "$PDFIUM_DIR" diff --check
          git -C "$PDFIUM_DIR" diff --stat

          if grep -RIE 'XPDF_ATRACE_SCOPED|ATrace_beginSection' \
              "$PDFIUM_DIR/core/" "$PDFIUM_DIR/fpdfsdk/" 2>/dev/null; then
            echo "ERROR: diagnostic ATrace markers present in r18 gated darken blend path display-list build" >&2
            exit 1
          fi

      - name: Install PDFium build dependencies
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build/pdfium"
          build/install-build-deps.sh --android --no-prompt --unsupported

      - name: Run gclient hooks
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build"
          gclient runhooks

      - name: Generate GN files
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          PDFIUM_DIR="$WORK_ROOT/pdfium_build/pdfium"
          cd "$PDFIUM_DIR"
          gn gen "$OUT_DIR" --args='
            target_os = "android"
            target_cpu = "arm64"
            is_debug = false
            is_component_build = false
            strip_debug_info = true
            use_remoteexec = false
            symbol_level = 0
            treat_warnings_as_errors = false
            clang_use_chrome_plugins = false
            android_static_analysis = "off"
            pdf_is_standalone = false
            pdf_is_complete_lib = true
            pdf_use_skia = false
            pdf_use_agg = true
            pdf_enable_v8 = false
            pdf_enable_xfa = false
            pdf_enable_fontations = false
            pdf_enable_rust_png = false
            pdf_use_partition_alloc = false
            default_min_sdk_version = 23
          '
          gn args "$OUT_DIR" --list --short \
            | grep -E '^(target_os|target_cpu|pdf_enable_v8|pdf_enable_xfa|pdf_use_skia|pdf_use_agg|pdf_is_complete_lib|pdf_use_partition_alloc|default_min_sdk_version|pdf_enable_fontations|pdf_enable_rust_png) ='

      - name: Build static PDFium
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build/pdfium"
          ninja -C "$OUT_DIR" pdfium -j"$(nproc)"

      - name: Verify r18 gated darken blend path display-list patch compiled in
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"

          LLVM_NM="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
          PDFIUM_A="$OUT_DIR/obj/libpdfium.a"

          for api in FPDFEx_SetRenderAbort FPDFEx_SetRenderCallbacks FPDFEx_SetRenderSkipMask FPDFEx_SetHugeImagePixelThreshold; do
            if ! "$LLVM_NM" -A "$PDFIUM_A" 2>/dev/null \
                | grep -E " T $api(\b|@)" >/dev/null; then
              echo "MISSING $api in libpdfium.a" >&2
              "$LLVM_NM" -A "$PDFIUM_A" 2>/dev/null | grep -E 'FPDFEx_SetRender|RenderCallbacks|RenderAbort|RenderSkipMask|HugeImage' | head -20
              exit 1
            fi
            echo "OK $api"
          done

          grep -q 'ShouldCancelRender' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'VeloceGetRenderCallbacks' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'render_skip_mask_' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'g_skip_mask' core/fpdfapi/render/veloce_render_skip_mask.cpp
          grep -q 'kVeloceRenderSkipHugeImage' core/fpdfapi/render/veloce_render_skip_mask.h
          grep -q 'VeloceShouldDeferImage' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'FillImagePlaceholder' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'FPDFEX_FEATURE_PATH_DISPLAY_LIST_FORM' public/fpdfex_render_callbacks.h
          grep -q 'VeloceTryRenderPathDisplayList' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'veloce_path_display_list.cpp' core/fpdfapi/render/BUILD.gn
          grep -q 'NativePathDisplayList' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'kCancelCheckNodeInterval' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'PathDisplayListCache' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'cache=%s' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'ClipPathIsNoOpForObjectBounds' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'elided_noop_clips' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'noopClips=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'clip_bounds->Intersect' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'VeloceTryRenderPathDisplayListForHolder' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'VelocePathDisplayListHolderKind::kRootPage' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'VelocePathDisplayListHolderKind::kForm' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'context_->CountLayers()' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'is_context_layer_holder' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'VeloceTryRenderPathDisplayListForHolder' core/fpdfapi/render/cpdf_progressiverenderer.cpp
          grep -q 'VelocePathDisplayListHolderKind::kRootPage' core/fpdfapi/render/cpdf_progressiverenderer.cpp
          grep -q 'graph_state_table' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'stroke_argb' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'AddGraphStateKey' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'GetUnsupportedTransparencyReason' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'return "blend_mode"' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'return "soft_mask"' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'BlendMode::kDarken' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'blendNodes=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'DrawPathNodeWithBlend' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'SetDIBitsWithBlend' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'FXDIB_Format::kBgra' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'CFX_DefaultRenderDevice' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'kMaxScratchBlendNodes' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'blend_scratch_replay_too_large' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'ShouldRejectScratchBlendReplay' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'returns kCancelled so callers do not draw legacy content over partial output' core/fpdfapi/render/veloce_path_display_list.h
          grep -q 'paint.stroke_argb = stroke ? status->GetStrokeArgb(path_obj) : 0' core/fpdfapi/render/veloce_path_display_list.cpp
          if grep -q 'GetFillAlpha() != 1.0f' core/fpdfapi/render/veloce_path_display_list.cpp; then
            echo "ERROR: fill alpha should not reject Veloce path display-list eligibility" >&2
            exit 1
          fi
          if grep -q 'GetStrokeAlpha() != 1.0f' core/fpdfapi/render/veloce_path_display_list.cpp; then
            echo "ERROR: stroke alpha should be replayed through DrawPath, not rejected as transparency" >&2
            exit 1
          fi
          grep -q 'holderKind=%s' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'HolderKindName' core/fpdfapi/render/veloce_path_display_list.cpp

      - name: Link Android shared library
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build/pdfium"
          PDFIUM_AGG_SHRINK=1 \
            bash "$GITHUB_WORKSPACE/repo/scripts/ci/link_pdfium_android_agg_so.sh"

      - name: Verify exported symbols
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"

          LLVM_NM="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
          SO="$OUT_DIR/libpdfium.so"

          for api in \
              FPDF_RenderPageBitmap \
              FPDFEx_SetRenderAbort \
              FPDFEx_SetRenderCallbacks \
              FPDFEx_LoadPageWithClassification \
              FPDFEx_SetRenderSkipMask \
              FPDFEx_SetHugeImagePixelThreshold \
              ; do
            if ! "$LLVM_NM" -D --defined-only -C "$SO" 2>/dev/null \
                | grep -E " T $api(\b|@)" >/dev/null; then
              echo "MISSING exported $api in libpdfium.so" >&2
              exit 1
            fi
            echo "OK exported $api"
          done

      - name: Package artifact
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"

          mkdir -p "$DIST_DIR/include" "$DIST_DIR/patches"
          cp "$OUT_DIR/libpdfium.so" "$DIST_DIR/libpdfium.so"
          cp "$OUT_DIR/obj/libpdfium.a" "$DIST_DIR/libpdfium.a"
          cp -R public/. "$DIST_DIR/include/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0[1-9]-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0011-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0012-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0013-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0014-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0015-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0016-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0017-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0018-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0019-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0020-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0021-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0022-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0023-*.patch "$DIST_DIR/patches/"
          cp "$GITHUB_WORKSPACE"/repo/patches/ship/0024-*.patch "$DIST_DIR/patches/"
          sha256sum "$DIST_DIR/libpdfium.so" > "$DIST_DIR/SHA256SUMS.txt"

          {
            printf 'pdfium_repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'pdfium_revision=%s\n' "$(git rev-parse HEAD)"
            printf 'renderer=agg\n'
            printf 'pgo=disabled\n'
            printf 'official_build=false\n'
            printf 'patches=patches/ship/01..09,0011,0012,0013,0014,0015,0016,0017,0018,0019,0020,0021,0022,0023,0024\n'
          } > "$DIST_DIR/build-info.txt"

      - name: Upload libpdfium artifact
        uses: actions/upload-artifact@v4
        with:
          name: libpdfium-android-arm64-r18-gated-darken-blend-path-display-list
          path: artifacts/libpdfium-android-arm64-r18-gated-darken-blend-path-display-list

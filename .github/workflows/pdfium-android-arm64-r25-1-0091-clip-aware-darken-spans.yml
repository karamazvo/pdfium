name: r25-1-0091 Clip-aware Darken spans - Build libpdfium Android arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build libpdfium.so
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      WORK_ROOT: /tmp/pdfium-r25-1-0091-clip-aware-darken-spans
      OUT_DIR: out/android_arm64_agg
      DIST_DIR: ${{ github.workspace }}/artifacts/libpdfium-android-arm64-r25-1-0091-clip-aware-darken-spans

    steps:
      - name: Checkout PDFium patch repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            ca-certificates \
            curl \
            file \
            git \
            lsb-release \
            openjdk-17-jdk-headless \
            python3 \
            python3-pkg-resources \
            python3-setuptools \
            unzip \
            xz-utils \
            zip

      - name: Fetch depot_tools
        run: |
          mkdir -p "$WORK_ROOT"
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$WORK_ROOT/depot_tools"
          echo "$WORK_ROOT/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch PDFium fork with Android deps
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          mkdir -p "$WORK_ROOT/pdfium_build"
          cd "$WORK_ROOT/pdfium_build"
          cat > .gclient <<GCLEOF
          solutions = [
            {
              "name": "pdfium",
              "url": "https://github.com/${{ github.repository }}.git",
              "managed": False,
              "revision": "${{ github.sha }}",
              "custom_deps": {},
              "custom_vars": {
                "checkout_android": True,
                "checkout_configuration": "default",
                "checkout_rust": False,
              },
            },
          ]
          target_os = ["android"]
          GCLEOF
          gclient sync --no-history --nohooks

      - name: Patch public PDFium API exports
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"
          python3 "$GITHUB_WORKSPACE/repo/scripts/ci/patch_pdfium_public_exports.py"

      - name: Apply r25 + 0051 + 0075-0076 + r25-1-0079-0091 patches
        run: |
          PDFIUM_DIR="$WORK_ROOT/pdfium_build/pdfium"
          for patch in \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0[1-9]-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0011-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0012-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0013-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0014-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0015-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0016-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0017-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0018-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0019-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0020-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0021-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0022-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0023-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0024-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0025-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0026-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0029-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0030-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0031-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0051-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0075-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0076-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0079-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0080-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0081-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0082-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0083-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0085-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0086-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0087-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0088-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0089-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0090-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0091-*.patch \
              ; do
            echo "Applying ${patch#$GITHUB_WORKSPACE/repo/}"
            git -C "$PDFIUM_DIR" apply --check "$patch"
            git -C "$PDFIUM_DIR" apply "$patch"
          done
          git -C "$PDFIUM_DIR" diff --check
          git -C "$PDFIUM_DIR" diff --stat

          if grep -RIE 'XPDF_ATRACE_SCOPED|ATrace_beginSection' \
              "$PDFIUM_DIR/core/" "$PDFIUM_DIR/fpdfsdk/" 2>/dev/null; then
            echo "ERROR: diagnostic ATrace markers present in r25-1-0091 build" >&2
            exit 1
          fi

      - name: Install PDFium build dependencies
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build/pdfium"
          build/install-build-deps.sh --android --no-prompt --unsupported

      - name: Run gclient hooks
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build"
          gclient runhooks

      - name: Generate GN files
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          PDFIUM_DIR="$WORK_ROOT/pdfium_build/pdfium"
          cd "$PDFIUM_DIR"
          gn gen "$OUT_DIR" --args='
            target_os = "android"
            target_cpu = "arm64"
            is_debug = false
            is_component_build = false
            strip_debug_info = true
            use_remoteexec = false
            symbol_level = 0
            treat_warnings_as_errors = false
            clang_use_chrome_plugins = false
            android_static_analysis = "off"
            pdf_is_standalone = false
            pdf_is_complete_lib = true
            pdf_use_skia = false
            pdf_use_agg = true
            pdf_enable_v8 = false
            pdf_enable_xfa = false
            pdf_enable_fontations = false
            pdf_enable_rust_png = false
            pdf_use_partition_alloc = false
            default_min_sdk_version = 23
          '
          gn args "$OUT_DIR" --list --short \
            | grep -E '^(target_os|target_cpu|pdf_enable_v8|pdf_enable_xfa|pdf_use_skia|pdf_use_agg|pdf_is_complete_lib|pdf_use_partition_alloc|default_min_sdk_version|pdf_enable_fontations|pdf_enable_rust_png) ='

      - name: Build static PDFium
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build/pdfium"
          ninja -C "$OUT_DIR" pdfium -j"$(nproc)"

      - name: Verify r25-1-0091 clip-aware exact Darken contract
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"
          LLVM_NM="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
          PDFIUM_A="$OUT_DIR/obj/libpdfium.a"

          for api in \
              FPDFEx_SetRenderAbort \
              FPDFEx_SetRenderCallbacks \
              FPDFEx_LoadPageWithClassification \
              FPDFEx_SetRenderSkipMask \
              FPDFEx_SetHugeImagePixelThreshold \
              FPDFEx_GetPageDimensions \
              ; do
            if ! "$LLVM_NM" -A "$PDFIUM_A" 2>/dev/null \
                | grep -E " T $api(\\b|@)" >/dev/null; then
              echo "MISSING $api in libpdfium.a" >&2
              exit 1
            fi
            echo "OK $api"
          done

          grep -q 'veloce_unified_render_backend.cpp' core/fpdfapi/render/BUILD.gn
          grep -q 'kVeloceUnifiedRenderBackendRevision\[\] = "r25-1-0091"' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'enum class VeloceUnifiedRenderResult : uint8_t' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'enum class VeloceUnifiedFallbackReason : uint8_t' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'struct VeloceUnifiedRenderMetrics' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'total_ns = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'holder_commands = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'path_commands = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'text_commands = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'candidate_postings = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'candidate_commands = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'candidate_chunks = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'candidate_streams = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'queried_bins = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'candidate_linear_replay = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'candidate_bounds_rejected = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'index_bytes = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'index_postings = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'compact_bounds_bytes = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'always_candidate_commands = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'cache_bytes = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'scratch_bytes = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'direct_path_commands = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'direct_path_dispatches = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'direct_darken_commands = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'direct_darken_dispatches = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'direct_darken_canonical = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'path_packet_commands = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'path_packet_dispatches = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'path_packet_state_flushes = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'path_packet_capacity_flushes = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'max_path_packet_commands = 0' core/fpdfapi/render/veloce_unified_render_backend.h
          grep -q 'VeloceTryRenderUnifiedProgram' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'program->EstimatedBytes()' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'VeloceTryRenderUnifiedProgramMeasured' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'kTelemetryMinCommands = 4096' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'VeloceRenderProgram' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'admittedLifetimeMs=' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'kVeloceRenderCommandKindCount' core/fpdfapi/page/veloce_render_program.h
          grep -q 'struct VeloceRenderCommand' core/fpdfapi/page/veloce_render_program.h
          grep -q 'static_assert(sizeof(VeloceRenderCommand) == 2)' core/fpdfapi/page/veloce_render_program.h
          grep -q 'VeloceCanDirectDrawPath' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'VeloceCanDirectDrawDarkenPath' core/fpdfapi/page/veloce_render_program.cpp
          DARKEN_GATE="$(sed -n '/bool VeloceCanDirectDrawDarkenPath/,/^}/p' \
              core/fpdfapi/page/veloce_render_program.cpp)"
          printf '%s\n' "$DARKEN_GATE" \
            | grep -q 'if (!path || !path->path().GetObject())'
          if printf '%s\n' "$DARKEN_GATE" | grep -q 'clip_path().HasRef()'; then
            echo "ERROR: exact Darken admission still rejects canonical object clips" >&2
            exit 1
          fi
          grep -q 'kDirectDarkenPath' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kMaxProgramBytes = 32u \* 1024u \* 1024u' core/fpdfapi/page/veloce_render_program.h
          grep -q 'command_count() const' core/fpdfapi/page/veloce_render_program.h
          grep -q 'command_kind_count(VeloceRenderCommandKind kind) const' core/fpdfapi/page/veloce_render_program.h
          grep -q 'build_lifetime_ns() const' core/fpdfapi/page/veloce_render_program.h
          grep -q 'index_lifetime_ns() const' core/fpdfapi/page/veloce_render_program.h
          grep -q 'HasOnlyCommandKind(VeloceRenderCommandKind kind) const' core/fpdfapi/page/veloce_render_program.h
          grep -q 'std::array<uint32_t, kVeloceRenderCommandKindCount>' core/fpdfapi/page/veloce_render_program.h
          grep -q '++command_kind_counts_' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'program->command_count()' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'class VeloceSpatialCandidateIndex final' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kColumns = 32' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kRows = 32' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kMinSpatialIndexCommands = 4096' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'kMaxSpatialIndexPostings = 4u \* 1024u \* 1024u' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'kMaxAlwaysCandidateCommands = 1024u \* 1024u' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'kMaxCompactBoundsBytes = 32u \* 1024u \* 1024u' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'kMaxBinsPerCommand = 64' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'struct VeloceQuantizedBounds' core/fpdfapi/page/veloce_render_program.h
          grep -q 'static_assert(sizeof(VeloceQuantizedBounds) == 8)' core/fpdfapi/page/veloce_render_program.h
          grep -q 'compact_bounds_.push_back(QuantizeBounds(bounds_, rect))' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'compact_bounds_.size() != command_count' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'kind != VeloceRenderCommandKind::kPath' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'holder.GetPageObjectByIndex(index)' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'VeloceSpatialCandidateIndex::Query' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'const CFX_FloatRect& current_holder_bounds' core/fpdfapi/page/veloce_render_program.cpp
          grep -q '!RectsExactlyMatch(bounds_, live_bounds)' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'VeloceSpatialQueryResult::kUseFullReplay' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'class VeloceSpatialCandidateCursor final' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kMaxStreams =' core/fpdfapi/page/veloce_render_program.h
          grep -q 'VeloceSpatialCandidateIndex::OpenCursor' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'VeloceSpatialCandidateCursor::NextChunk' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'raw_candidate_count() const' core/fpdfapi/page/veloce_render_program.h
          grep -q 'queried_bin_count() const' core/fpdfapi/page/veloce_render_program.h
          grep -q 'raw_candidate_count_ +=' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'raw_posting_count >= command_count_' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'const bool use_bounds_filter = !query.Contains(bounds_)' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'VeloceSpatialCandidateCursor::SetBoundsFilter' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'VeloceSpatialCandidateCursor::PassesBoundsFilter' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'bounds_rejected_count() const' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kCandidateChunkCommands = 4096' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'index->OpenCursor(' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'cursor.NextChunk(candidate_chunk)' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'sizeof(cursor) + sizeof(candidate_chunk)' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'program->command_count() != holder->GetPageObjectCount()' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'program->command_kind_count(VeloceRenderCommandKind::kPath)' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'CommandMatchesObject' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'status->RenderSingleObject(object, holder_to_device)' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'status->RenderVeloceDirectPathPacket(' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'CPDF_RenderStatus::RenderVeloceDirectPath' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'CPDF_RenderStatus::RenderVeloceDirectPathPacket' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'CPDF_RenderStatus::RenderVeloceDirectDarkenPath' core/fpdfapi/render/cpdf_renderstatus.cpp
          sed -n '/CPDF_RenderStatus::RenderVeloceDirectDarkenPath/,/^}/p' \
              core/fpdfapi/render/cpdf_renderstatus.cpp \
            | grep -q 'ProcessClipPath(path_obj->clip_path(), mtObj2Device)'
          grep -q 'device_->DrawPathWithBlend(' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'CFX_AggDeviceDriver::DrawPathWithBlend' core/fxge/agg/cfx_agg_devicedriver.cpp
          grep -q 'CompositeByteMaskLine' core/fxge/agg/cfx_agg_devicedriver.cpp
          grep -q 'DarkenCoverageMaskMatchesSingleBgraObject' core/fxge/dib/cfx_dibitmap_unittest.cpp
          grep -q 'kMaxPacketCommands = 256' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'kMaxPacketPoints = 16u \* 1024u' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'packet_graph_state == graph_state' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'packet_stroke_argb == stroke_argb' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'packet_fill_options == fill_options' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'device_->DrawPathBatch(' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'CFX_AggDeviceDriver::DrawPathBatch' core/fxge/agg/cfx_agg_devicedriver.cpp
          grep -q 'path_data.remove_all()' core/fxge/agg/cfx_agg_devicedriver.cpp
          grep -q 'rasterizer.reset()' core/fxge/agg/cfx_agg_devicedriver.cpp
          grep -q 'RenderDeviceDriverIface::DrawPathBatch' core/fxge/renderdevicedriver_iface.cpp
          grep -q 'DrawPath(\*path, &object_to_device\[i\]' core/fxge/renderdevicedriver_iface.cpp
          grep -q 'pattern_proven_absent' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'return VeloceUnifiedRenderResult::kRendered' core/fpdfapi/render/veloce_unified_render_backend.cpp
          grep -q 'SetVeloceRenderProgramOwner' core/fpdfapi/page/cpdf_pageobject.cpp
          grep -q 'InvalidateVeloceRenderProgram' core/fpdfapi/page/cpdf_pageobject.cpp
          grep -q 'veloce_render_program_owner_->ResetVeloceRenderProgram()' core/fpdfapi/page/cpdf_pageobject.cpp
          grep -q 'VeloceTryRenderUnifiedProgramMeasured(this, pObjectHolder' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'VeloceTryRenderUnifiedProgramMeasured(' core/fpdfapi/render/cpdf_progressiverenderer.cpp
          grep -q 'kVeloceLegacyPathDisplayListEnabled = false' core/fpdfapi/render/veloce_path_display_list.h
          grep -A8 'VeloceTryRenderPathDisplayListForHolder(' \
              core/fpdfapi/render/veloce_path_display_list.cpp \
            | grep -q '!kVeloceLegacyPathDisplayListEnabled'

          if ! "$LLVM_NM" -A -C "$PDFIUM_A" 2>/dev/null \
              | grep -F ' T VeloceTryRenderUnifiedProgram(' >/dev/null; then
            echo "ERROR: unified backend implementation missing from libpdfium.a" >&2
            exit 1
          fi
          if ! "$LLVM_NM" -A -C "$PDFIUM_A" 2>/dev/null \
              | grep -F ' T VeloceTryRenderUnifiedProgramMeasured(' >/dev/null; then
            echo "ERROR: measured unified backend entry missing from libpdfium.a" >&2
            exit 1
          fi
          if ! "$LLVM_NM" -A -C "$PDFIUM_A" 2>/dev/null \
              | grep -F ' T VeloceSpatialCandidateIndex::Query(' >/dev/null; then
            echo "ERROR: spatial candidate query missing from libpdfium.a" >&2
            exit 1
          fi
          if ! "$LLVM_NM" -A -C "$PDFIUM_A" 2>/dev/null \
              | grep -F ' T VeloceSpatialCandidateIndex::OpenCursor(' >/dev/null; then
            echo "ERROR: streaming spatial cursor missing from libpdfium.a" >&2
            exit 1
          fi

          if grep -RIE 'VeloceTryRenderUnifiedProgram' fpdfsdk public 2>/dev/null; then
            echo "ERROR: unified backend leaked into the public API" >&2
            exit 1
          fi

          if grep -q 'VeloceRenderProgram\|render_program_' \
              core/fpdfapi/render/veloce_path_display_list.cpp; then
            echo "ERROR: legacy 0077/0078 RenderProgram consumer present" >&2
            exit 1
          fi
          if grep -q 'veloce_render_plan.cpp\|veloce_render_plan.h' core/fpdfapi/render/BUILD.gn; then
            echo "ERROR: experimental RenderPlan v1 present" >&2
            exit 1
          fi
          if grep -RIE 'VeloceTryRenderPlanForHolder|VeloceBuildRenderPlanSkeletonForHolder' \
              core/fpdfapi/render core/fxge 2>/dev/null; then
            echo "ERROR: experimental RenderPlan v1 runtime present" >&2
            exit 1
          fi
          if grep -RIE 'combined_path|Append\(\*path' \
              core/fpdfapi/render/cpdf_renderstatus.cpp \
              core/fxge/agg/cfx_agg_devicedriver.cpp 2>/dev/null; then
            echo "ERROR: path-state packets merged geometry" >&2
            exit 1
          fi
          if grep -E 'malloc|make_unique|make_shared|mutex|DrawPathBatch|device_->DrawPath|GetRenderDevice\(\)->DrawPath' \
              core/fpdfapi/render/veloce_unified_render_backend.cpp; then
            echo "ERROR: executor introduced an unbounded allocator, lock, or second path rasterizer" >&2
            exit 1
          fi
          if [ "$(grep -c '__android_log_print' core/fpdfapi/render/veloce_unified_render_backend.cpp)" -ne 1 ]; then
            echo "ERROR: expected exactly one bounded RenderProgram summary log" >&2
            exit 1
          fi
          if grep -E 'std::vector|kMaxCandidateCommands|index->Query\(' \
              core/fpdfapi/render/veloce_unified_render_backend.cpp; then
            echo "ERROR: executor retained dynamic candidate storage or the dense cap" >&2
            exit 1
          fi
          if grep -E 'RectIntersects|object->GetRect\(\)' \
              core/fpdfapi/render/veloce_unified_render_backend.cpp; then
            echo "ERROR: executor retained redundant live rectangle culling" >&2
            exit 1
          fi
          echo "All r25-1-0091 clip-aware exact Darken guards passed"

      - name: Link Android shared library
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build/pdfium"
          PDFIUM_AGG_SHRINK=1 \
            bash "$GITHUB_WORKSPACE/repo/scripts/ci/link_pdfium_android_agg_so.sh"

      - name: Verify exported symbols
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"
          LLVM_NM="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
          SO="$OUT_DIR/libpdfium.so"
          for api in \
              FPDF_RenderPageBitmap \
              FPDFEx_SetRenderAbort \
              FPDFEx_SetRenderCallbacks \
              FPDFEx_LoadPageWithClassification \
              FPDFEx_SetRenderSkipMask \
              FPDFEx_SetHugeImagePixelThreshold \
              FPDFEx_GetPageDimensions \
              ; do
            if ! "$LLVM_NM" -D --defined-only -C "$SO" 2>/dev/null \
                | grep -E " T $api(\\b|@)" >/dev/null; then
              echo "MISSING exported $api in libpdfium.so" >&2
              exit 1
            fi
            echo "OK exported $api"
          done

      # The custom AGG linker discovers every archive already materialized
      # under out/obj. Build tests only after libpdfium.so is complete so
      # libc++.a cannot be selected alongside the same runtime object files.
      - name: Compile r25-1-0091 unit tests after shared-library link
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build/pdfium"
          ninja -C "$OUT_DIR" pdfium_unittests -j"$(nproc)"

      - name: Package artifact
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"
          mkdir -p "$DIST_DIR/include" "$DIST_DIR/patches"
          cp "$OUT_DIR/libpdfium.so" "$DIST_DIR/libpdfium.so"
          cp "$OUT_DIR/obj/libpdfium.a" "$DIST_DIR/libpdfium.a"
          cp -R public/. "$DIST_DIR/include/"
          for patch in \
              01 02 03 04 05 06 07 08 09 \
              0011 0012 0013 0014 0015 0016 0017 0018 0019 \
              0020 0021 0022 0023 0024 0025 0026 0029 0030 0031 \
              0051 0075 0076 0079 0080 0081 0082 0083 0085 0086 0087 0088 0089 0090 0091; do
            cp "$GITHUB_WORKSPACE"/repo/patches/ship/"$patch"-*.patch "$DIST_DIR/patches/"
          done
          sha256sum "$DIST_DIR/libpdfium.so" > "$DIST_DIR/SHA256SUMS.txt"

          {
            printf 'revision=r25-1-0091\n'
            printf 'series=r25-1-unified-backend-generation-1\n'
            printf 'pdfium_repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'pdfium_revision=%s\n' "$(git rev-parse HEAD)"
            printf 'renderer=agg\n'
            printf 'rendering_base=r25+0051+0075+0076+0079+0080+0081+0082+0083+0085+0086+0087+0088+0089+0090+0091\n'
            printf 'unified_backend=compact-bounds-plus-clip-aware-exact-darken-spans\n'
            printf 'index_consumer=32x32-coarse-plus-conservative-16bit-command-bounds\n'
            printf 'candidate_storage=no-vector-no-logical-cap\n'
            printf 'compact_bounds=8-bytes-per-command-32MiB-hard-cap\n'
            printf 'full_page_bounds_filter=disabled\n'
            printf 'candidate_order=existing-cursor-painter-order\n'
            printf 'path_packets=256-commands-16384-points-exact-per-path-raster\n'
            printf 'telemetry=android-holders-at-least-4096-commands-one-summary-per-render\n'
            printf 'telemetry_cost=no-per-object-clocks-no-allocation-no-lock\n'
            printf 'darken_pixel_owner=agg-coverage-to-existing-destination\n'
            printf 'darken_allocation=none\n'
            printf 'darken_order=one-raster-composite-per-pdf-object\n'
            printf 'darken_clip=canonical-process-clip-path\n'
            printf 'unit_tests=compiled-after-shared-library-link\n'
            printf 'packet_state=live-graph-identity-resolved-color-and-fill-options\n'
            printf 'legacy_path_display_list=compiled-disabled-before-work\n'
            printf 'pixel_owner=pdfium-process-path-and-render-device\n'
            printf 'skipped_revision=0084-not-emitted\n'
            printf 'patches=01..09,0011..0026,0029,0030,0031,0051,0075,0076,0079,0080,0081,0082,0083,0085,0086,0087,0088,0089,0090,0091\n'
            printf 'excluded_renderplan_v1=0053..0074\n'
            printf 'excluded_legacy_consumers=0077,0078\n'
          } > "$DIST_DIR/build-info.txt"


name: r25-jpx-4-0005 exact clipped JPX decode - Build libpdfium Android arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build libpdfium.so
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      WORK_ROOT: /tmp/pdfium-r25-jpx-4-0005-exact-clipped-jpx-decode
      OUT_DIR: out/android_arm64_agg
      DIST_DIR: ${{ github.workspace }}/artifacts/libpdfium-android-arm64-r25-jpx-4-0005-exact-clipped-jpx-decode

    steps:
      - name: Checkout PDFium patch repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            ca-certificates \
            curl \
            file \
            git \
            lsb-release \
            openjdk-17-jdk-headless \
            python3 \
            python3-pkg-resources \
            python3-setuptools \
            unzip \
            xz-utils \
            zip

      - name: Fetch depot_tools
        run: |
          mkdir -p "$WORK_ROOT"
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$WORK_ROOT/depot_tools"
          echo "$WORK_ROOT/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch PDFium fork with Android deps
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"

          mkdir -p "$WORK_ROOT/pdfium_build"
          cd "$WORK_ROOT/pdfium_build"

          cat > .gclient <<GCLEOF
          solutions = [
            {
              "name": "pdfium",
              "url": "https://github.com/${{ github.repository }}.git",
              "managed": False,
              "revision": "${{ github.sha }}",
              "custom_deps": {},
              "custom_vars": {
                "checkout_android": True,
                "checkout_configuration": "default",
                "checkout_rust": False,
              },
            },
          ]
          target_os = ["android"]
          GCLEOF

          gclient sync --no-history --nohooks

      - name: Patch public PDFium API exports
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"
          python3 "$GITHUB_WORKSPACE/repo/scripts/ci/patch_pdfium_public_exports.py"

      - name: Apply accepted base and r25-jpx-4-0005
        run: |
          PDFIUM_DIR="$WORK_ROOT/pdfium_build/pdfium"
          for patch in \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0[1-9]-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0011-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0012-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0013-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0014-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0015-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0016-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0017-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0018-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0019-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0020-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0021-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0022-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0023-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0024-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0025-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0026-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0029-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0030-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0031-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0051-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0075-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0076-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0092-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0093-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0094-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0095-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0096-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0097-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0098-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0099-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0100-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0101-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0102-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0103-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0104-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0105-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0106-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0107-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0108-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0109-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0110-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0111-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0112-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0113-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0114-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0115-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0116-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0117-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0118-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0119-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0120-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0121-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0122-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0123-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0125-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0126-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0127-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0128-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0129-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0133-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0134-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0135-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0136-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0137-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/ship/0138-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/experiments/normal-page/0005-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/experiments/normal-page/0006-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/experiments/normal-page/0011-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/experiments/cancellation/0001-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/experiments/cancellation/0002-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/experiments/cancellation/0003-*.patch \
              "$GITHUB_WORKSPACE"/repo/patches/experiments/jpx/0005-*.patch \
              ; do
            echo "Applying ${patch#$GITHUB_WORKSPACE/repo/}"
            git -C "$PDFIUM_DIR" apply --check "$patch"
            git -C "$PDFIUM_DIR" apply "$patch"
          done
          git -C "$PDFIUM_DIR" diff --check
          git -C "$PDFIUM_DIR" diff --stat

          if grep -RIE 'XPDF_ATRACE_SCOPED|ATrace_beginSection' \
              "$PDFIUM_DIR/core/" "$PDFIUM_DIR/fpdfsdk/" 2>/dev/null; then
            echo "ERROR: diagnostic ATrace markers present in r25-jpx-4-0005 build" >&2
            exit 1
          fi

      - name: Install PDFium build dependencies
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build/pdfium"
          build/install-build-deps.sh --android --no-prompt --unsupported

      - name: Run gclient hooks
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build"
          gclient runhooks

      - name: Generate GN files
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          PDFIUM_DIR="$WORK_ROOT/pdfium_build/pdfium"
          cd "$PDFIUM_DIR"
          gn gen "$OUT_DIR" --args='
            target_os = "android"
            target_cpu = "arm64"
            is_debug = false
            is_component_build = false
            strip_debug_info = true
            use_remoteexec = false
            symbol_level = 0
            treat_warnings_as_errors = false
            clang_use_chrome_plugins = false
            android_static_analysis = "off"
            pdf_is_standalone = false
            pdf_is_complete_lib = true
            pdf_use_skia = false
            pdf_use_agg = true
            pdf_enable_v8 = false
            pdf_enable_xfa = false
            pdf_enable_fontations = false
            pdf_enable_rust_png = false
            pdf_use_partition_alloc = false
            default_min_sdk_version = 23
          '
          gn args "$OUT_DIR" --list --short \
            | grep -E '^(target_os|target_cpu|pdf_enable_v8|pdf_enable_xfa|pdf_use_skia|pdf_use_agg|pdf_is_complete_lib|pdf_use_partition_alloc|default_min_sdk_version|pdf_enable_fontations|pdf_enable_rust_png) ='

      - name: Build static PDFium
        run: |
          export PATH="$WORK_ROOT/depot_tools:$PATH"
          cd "$WORK_ROOT/pdfium_build/pdfium"
          ninja -C "$OUT_DIR" pdfium -j"$(nproc)"

      - name: Verify r25-8-0138 ordered stroke renderer tape contract
        run: |
          cd "$WORK_ROOT/pdfium_build/pdfium"
          trap 'echo "ERROR: r25-8-0138 contract failed at shell line $LINENO: $BASH_COMMAND" >&2' ERR

          LLVM_NM="$(pwd)/third_party/llvm-build/Release+Asserts/bin/llvm-nm"
          PDFIUM_A="$OUT_DIR/obj/libpdfium.a"

          for api in \
              FPDFEx_SetRenderAbort \
              FPDFEx_SetRenderCallbacks \
              FPDFEx_LoadPageWithClassification \
              FPDFEx_SetRenderSkipMask \
              FPDFEx_SetHugeImagePixelThreshold \
              FPDFEx_GetPageDimensions \
              ; do
            if ! "$LLVM_NM" -A "$PDFIUM_A" 2>/dev/null \
                | grep -E " T $api(\b|@)" >/dev/null; then
              echo "MISSING $api in libpdfium.a" >&2
              exit 1
            fi
            echo "OK $api"
          done

          grep -q 'ShouldCancelRender' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'FPDFEX_FEATURE_PATH_DISPLAY_LIST_FORM' public/fpdfex_render_callbacks.h
          grep -q 'FPDFEx_GetPageDimensions' public/fpdfview.h
          grep -q 'static_assert(sizeof(FPDFEx_PageDimensions) == 32)' fpdfsdk/fpdf_view.cpp
          grep -q 'VeloceTryRenderPathDisplayListForHolder' core/fpdfapi/render/cpdf_renderstatus.cpp
          grep -q 'VeloceTryRenderPathDisplayListForHolder' core/fpdfapi/render/cpdf_progressiverenderer.cpp
          grep -q 'CanDrawBlendNodeWithMask' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'MaskRun' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'run_flush_end' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'FlushGroupRun' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'group_run_composites' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'groupRunComposites=%zu' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'FXDIB_Format::kBgra' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'SetDIBitsWithBlend' core/fpdfapi/render/veloce_path_display_list.cpp
          grep -q 'veloce_render_program.h' core/fpdfapi/page/BUILD.gn
          grep -q 'class VeloceRenderProgram final' core/fpdfapi/page/veloce_render_program.h
          grep -q 'friend class VeloceRenderProgramBuilder' core/fpdfapi/page/veloce_render_program.h
          grep -q 'std::shared_ptr<const VeloceRenderProgram> veloce_render_program_' core/fpdfapi/page/cpdf_pageobjectholder.h
          grep -q 'GetVeloceRenderProgram' core/fpdfapi/page/cpdf_pageobjectholder.h
          grep -q 'SetVeloceRenderProgram' core/fpdfapi/page/cpdf_pageobjectholder.cpp
          grep -q 'ResetVeloceRenderProgram' core/fpdfapi/page/cpdf_pageobjectholder.cpp
          grep -q 'veloce_render_program.cpp' core/fpdfapi/page/BUILD.gn
          grep -q 'kVeloceRenderProgramFormatVersion = 24u' core/fpdfapi/page/veloce_render_program.h
          grep -q 'enum class VeloceRenderOpcode : uint8_t' core/fpdfapi/page/veloce_render_program.h
          grep -q 'static_assert(sizeof(VeloceRenderOpcode) == 1)' core/fpdfapi/page/veloce_render_program.h
          grep -q 'struct VeloceRenderProgramHeader' core/fpdfapi/page/veloce_render_program.h
          grep -q 'static_assert(sizeof(VeloceRenderProgramHeader) == 16u)' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kMaxHolderCommands = 32u \* 1024u \* 1024u' core/fpdfapi/page/veloce_render_program.h
          grep -q 'struct VeloceNativeRun' core/fpdfapi/page/veloce_render_program.h
          grep -q 'static_assert(sizeof(VeloceNativeRun) == 16u)' core/fpdfapi/page/veloce_render_program.h
          grep -q 'uint32_t first_payload = 0' core/fpdfapi/page/veloce_render_program.h
          grep -q 'std::vector<VeloceNativeRun> native_runs_' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kVeloceExactNoOpWordBits = 64u' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kVeloceExactNoOpRankBlockWords = 4u' core/fpdfapi/page/veloce_render_program.h
          grep -q 'std::vector<uint64_t> exact_noop_words_' core/fpdfapi/page/veloce_render_program.h
          grep -q 'std::vector<uint32_t> exact_noop_rank_blocks_' core/fpdfapi/page/veloce_render_program.h
          grep -q 'AppendExactNoOp' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'BuildExactNoOpRankBlocks' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'NativeLinePayloadIndex' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'exactNoOpLines=%u exactNoOpWords=%zu' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'kVeloceNativeRunLookupBlockSize = 256u' core/fpdfapi/page/veloce_render_program.h
          grep -q 'struct VeloceNativeRunLookupBlock' core/fpdfapi/page/veloce_render_program.h
          grep -q 'static_assert(sizeof(VeloceNativeRunLookupBlock) == 8u)' core/fpdfapi/page/veloce_render_program.h
          grep -q 'FindNativeRunCursorForSpatialReplay' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'struct VeloceMandatoryCommandRange' core/fpdfapi/page/veloce_render_program.h
          grep -q 'static_assert(sizeof(VeloceMandatoryCommandRange) == 8u)' core/fpdfapi/page/veloce_render_program.h
          grep -q 'class VeloceOrderedCommandCursor final' core/fpdfapi/page/veloce_render_program.h
          grep -q 'std::vector<VeloceMandatoryCommandRange> mandatory_ranges_' core/fpdfapi/page/veloce_render_program.h
          grep -q 'native_command_count' core/fpdfapi/page/veloce_render_program.h
          grep -q 'has_native_commands() const' core/fpdfapi/page/veloce_render_program.h
          grep -q 'std::array<uint32_t, kVeloceRenderOpcodeCount>' core/fpdfapi/page/veloce_render_program.h
          grep -q 'AppendNativeRun' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'NativeRunsCoverRange' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'spatial_index_->is_valid()' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'opcode_counts_\[static_cast<size_t>(opcode)\]' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'VeloceRenderProgramBuilder::AppendPageObject' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'VeloceRenderProgramBuilder::Finish' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'kNativeOpaqueLine' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kNativeTranslationOriginLine' core/fpdfapi/page/veloce_render_program.h
          grep -q 'static_assert(sizeof(VeloceNativeLine) == 24u)' core/fpdfapi/page/veloce_render_program.h
          grep -q 'static_assert(sizeof(VeloceNativeTranslationOriginLine) == 16u)' core/fpdfapi/page/veloce_render_program.h
          grep -q 'using VeloceNativeTranslationLineStorage' core/fpdfapi/page/veloce_render_program.h
          grep -q 'static_assert(sizeof(VeloceNativeLineRun) == 12u)' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kVeloceInlineTranslationMatrixIndex = 0xffffu' core/fpdfapi/page/veloce_render_program.h
          grep -q 'CPDF_ContentMarks content_marks' core/fpdfapi/page/veloce_render_program.h
          grep -q 'enum class VeloceNativeLineRejectReason' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kMaxRetainedProgramBytes = 96u \* 1024u \* 1024u' core/fpdfapi/page/veloce_render_program.h
          grep -q 'static_assert(sizeof(VeloceOpaquePathState) == 28u)' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kMaxNativeLines = 3u \* 1024u \* 1024u' core/fpdfapi/page/veloce_render_program.h
          grep -q 'class VeloceTieredLineStorage final' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kFirstChunkLines = 16u' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kSecondChunkLines = 64u' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kThirdChunkLines = 256u' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kFourthChunkLines = 1024u' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kDenseChunkLines = 4096u' core/fpdfapi/page/veloce_render_program.h
          grep -q 'NextAppendReservationLines' core/fpdfapi/page/veloce_render_program.h
          grep -q 'lineStorage=geometric_16_64_256_1024_4096' \
              core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'NativeLineStorageIsProportionalAndPreservesTierBoundaries' \
              core/fpdfapi/page/veloce_render_program_unittest.cpp
          grep -q 'TranslationLineStorageUsesTheSameProportionalLayout' \
              core/fpdfapi/page/veloce_render_program_unittest.cpp
          if grep -qE \
              'VeloceNative(Line|TranslationLine)Storage::kChunkLines|std::array<VeloceNative(Line|TranslationOriginLine), kChunkLines>' \
              core/fpdfapi/page/veloce_render_program.{h,cpp}; then
            echo "ERROR: fixed 4096-line first allocation remains in r25-8-0138" >&2
            exit 1
          fi
          grep -q 'TryAppendNativeOpaqueStroke' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'kNativeOpaqueStrokePath' core/fpdfapi/page/veloce_render_program.h
          grep -q 'struct VeloceNativeStrokePath' core/fpdfapi/page/veloce_render_program.h
          grep -q 'struct VeloceClipRun' core/fpdfapi/page/veloce_render_program.h
          grep -q 'native_stroke_paths_' core/fpdfapi/page/veloce_render_program.h
          grep -q 'clip_runs_' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kMaxNativeStrokePathPoints = 4u \* 1024u \* 1024u' core/fpdfapi/page/veloce_render_program.h
          grep -q 'HashOpaquePathState' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'HashMatrix' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'HasSameVisibilityScope' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'RememberVisibilityScope' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'struct VeloceSpatialCommandBlock' core/fpdfapi/page/veloce_render_program.h
          grep -q 'static_assert(sizeof(VeloceSpatialCommandBlock) == 32u)' core/fpdfapi/page/veloce_render_program.h
          grep -q 'kVeloceSpatialBlockUnbounded = 1u << 0' core/fpdfapi/page/veloce_render_program.h
          grep -q 'std::array<uint64_t, kVeloceSpatialBlockWordCount> candidate_words' core/fpdfapi/page/veloce_render_program.h
          grep -q 'class VeloceSpatialOrdinalIndex final' core/fpdfapi/page/veloce_render_program.h
          grep -q 'spatial_holder_bounds_' core/fpdfapi/page/veloce_render_program.h
          grep -q 'spatial_index_abandoned_' core/fpdfapi/page/veloce_render_program.h
          grep -q 'MarkCandidates' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'kMaxBlocks = 128u \* 1024u' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'kCommandsPerBlock = 32u' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'NativeRunsCoverSpatialRange' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'revision=r25-8-0138 event=compile' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'mode=ordered_stroke_renderer_tape' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'CanStartWithPageObject' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'CanStartWithParsedOpaqueLine' core/fpdfapi/page/veloce_render_program.cpp
          grep -q 'revision=r25-8-0138 event=acquire_policy' \
              core/fpdfapi/page/cpdf_pageobjectholder.cpp
          grep -q 'preactivationPathProbes=%u preactivationLineProbes=%u' \
              core/fpdfapi/page/cpdf_pageobjectholder.cpp
          grep -q 'SuccessLazyPreflightActivatesOnlyExactNativeCandidates' \
              core/fpdfapi/page/veloce_render_program_unittest.cpp
          ACTIVATION_BLOCK="$(sed -n \
              '/void CPDF_PageObjectHolder::AppendPageObject(/,/bool CPDF_PageObjectHolder::HasVeloceParsedLineContext()/p' \
              core/fpdfapi/page/cpdf_pageobjectholder.cpp)"
          printf '%s\n' "$ACTIVATION_BLOCK" \
              | grep -q 'CanStartWithPageObject'
          printf '%s\n' "$ACTIVATION_BLOCK" \
              | grep -q 'CanStartWithParsedOpaqueLine'
          printf '%s\n' "$ACTIVATION_BLOCK" \
              | grep -q 'candidate->has_native_commands()'
          if printf '%s\n' "$ACTIVATION_BLOCK" \
              | grep -q 'VeloceNowMicros'; then
            echo "ERROR: per-object activation timing found in r25-8-0138" >&2
            exit 1
          fi
          grep -q 'parserDirectLineAttempts=%u' core/fpdfapi/page/veloce_render_program.cpp
